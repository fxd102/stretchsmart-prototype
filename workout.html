<!DOCTYPE html>
<!--
  8-Week Strength & Impact Tracker — public copy.
  Program v1.0 designed by the household doctor guild (Claude #603), 2026-09-01.
  PRIVACY: this is the PUBLIC copy — keep it free of any name or personal detail.
  Anything sensitive belongs only in the private copy, never on this public page.
  DO NOT add personal specifics here; if a fuller private record is needed, use the private copy.
  (Maintainer: #584.)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Strength &amp; Impact Tracker</title>
<style>
  :root {
    --bg:#12121f; --card:#1a1a2e; --card2:#16213e; --line:#2a2a4a;
    --ink:#f5f5fa; --dim:#9a9ab0; --accent:#e94560; --teal:#4ecdc4; --amber:#e9a045;
    --good:#4caf72;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.5; padding-bottom:60px;
  }
  .wrap { max-width:640px; margin:0 auto; padding:16px; }
  .eyebrow { color:var(--dim); font-size:12px; letter-spacing:2px; text-transform:uppercase; text-align:center; }
  h1 { font-size:24px; text-align:center; margin:4px 0 2px; color:var(--accent); }
  .sub { text-align:center; color:var(--dim); font-size:13px; margin-bottom:16px; }
  .tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:12px; }
  .tab {
    flex:0 0 auto; padding:8px 12px; border-radius:20px; border:1px solid var(--line);
    background:var(--card); color:var(--dim); font-size:13px; font-weight:600; cursor:pointer;
    white-space:nowrap;
  }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .phase-note { color:var(--teal); font-size:13px; background:var(--card2); border-radius:12px; padding:10px 12px; margin-bottom:14px; }
  .session { background:var(--card); border-radius:16px; padding:14px; margin-bottom:14px; border:1px solid var(--line); }
  .session h2 { font-size:16px; margin:0 0 2px; }
  .session .day { color:var(--amber); font-weight:700; font-size:12px; letter-spacing:1px; text-transform:uppercase; }
  .weeks { display:flex; gap:14px; margin:10px 0 12px; flex-wrap:wrap; }
  .wk { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--dim); cursor:pointer; user-select:none; }
  .wk input { width:20px; height:20px; accent-color:var(--good); }
  .wk.checked { color:var(--good); }
  table { width:100%; border-collapse:collapse; }
  td { padding:10px 4px; border-top:1px solid var(--line); vertical-align:middle; font-size:14px; }
  td.ex { width:auto; }
  .exname { font-weight:600; }
  .presc { color:var(--dim); font-size:12px; margin-top:2px; }
  td.wt { width:78px; text-align:right; }
  .wt input {
    width:64px; padding:6px; border-radius:8px; border:1px solid var(--line);
    background:var(--card2); color:var(--ink); font-size:14px; text-align:center;
  }
  .wt input::placeholder { color:#5a5a70; }
  .modcard { background:var(--card2); border-radius:12px; padding:11px 13px; margin-bottom:14px; font-size:13px; }
  .modcard h3 { margin:0 0 5px; font-size:13px; color:var(--amber); letter-spacing:.5px; text-transform:uppercase; }
  .modcard.impact h3 { color:var(--accent); }
  .rule { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; font-size:14px; }
  .rule h3 { margin:0 0 6px; font-size:14px; color:var(--teal); }
  .rule ul { margin:0; padding-left:18px; }
  .rule li { margin:4px 0; }
  .rule.warn { border-color:#5a3a2a; }
  .rule.warn h3 { color:var(--amber); }
  .footer { text-align:center; color:#5a5a70; font-size:11px; margin-top:20px; }
  .notes { width:100%; margin-top:8px; border-radius:8px; border:1px solid var(--line); background:var(--card2); color:var(--ink); font-size:13px; padding:8px; resize:vertical; min-height:38px; }
  .reset { display:block; margin:20px auto 0; background:none; border:1px solid var(--line); color:var(--dim); border-radius:8px; padding:8px 14px; font-size:12px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">8-Week Program</div>
  <h1>Strength &amp; Impact Tracker</h1>
  <div class="sub">Ranges are intentional — pick your working weight by how form and energy feel that day. Log it, and watch it climb.</div>

  <div class="tabs" id="tabs"></div>
  <div id="view"></div>

  <button class="reset" onclick="if(confirm('Clear all logged weights and checkmarks? This cannot be undone.')){localStorage.clear();render();}">Reset all tracking</button>

  <div class="footer">
    Program v1.0 · designed by the household doctor guild<br>
    Your logs are saved only on this device, in this browser.
  </div>
</div>

<script>
const PROGRAM = [
  {
    name:"Weeks 1–2 · Form Re-Establishment", weeks:[1,2],
    note:"Rebuild the movement patterns before loading heavy. Tue + Fri: running 1.5–2 mi at a conversational pace. No impact block yet.",
    sessions:[
      {day:"Mon", label:"Session A — Squat focus", ex:[
        ["Goblet squat","3×10 @ 15–20 lb DB"],
        ["Barbell deadlift","3×8 @ 45–55 lb"],
        ["Barbell overhead press","3×8 @ 15–20 lb"],
        ["Single-leg calf raise","3×15/side · bodyweight, hold rail"],
        ["Face pull","2×15 @ 20 lb"],
        ["Plank","3×30 sec"]]},
      {day:"Thu", label:"Session B — Deadlift focus", ex:[
        ["Barbell deadlift","3×8 @ 55–65 lb"],
        ["Bulgarian split squat","3×8/side · bodyweight"],
        ["Bench press (barbell or DB)","3×10 @ 25–35 lb"],
        ["Assisted pull-up","3×8 · assist leaving 2 in reserve"],
        ["Bent-over row","3×10 @ 30–40 lb"],
        ["Bird dog","3×10/side"]]},
    ],
    wed:"Hip mobility 10 min · thoracic spine (foam-roller extensions, cat-cow, thread-the-needle) 10 min · balance (single-leg stands, tandem walks) 10 min · wall angels 3×15 · optional tai chi or gentle yoga.",
    impact:null
  },
  {
    name:"Weeks 3–4 · Progressive Ramp + Impact Begins", weeks:[3,4],
    note:"Load starts climbing and the impact block enters (Tue). Fri: running 2 mi. Wed adds single-leg RDL 3×8/side @ 10–15 lb.",
    sessions:[
      {day:"Mon", label:"Session A", ex:[
        ["Back squat (barbell)","4×6 @ 45–55 lb · goblet if form slips"],
        ["Barbell deadlift","4×6 @ 65–75 lb"],
        ["Overhead press","4×6 @ 20–30 lb"],
        ["Standing calf raise (hold DBs)","3×12 @ 15–25 lb ea"],
        ["Face pull","3×12 @ 25–30 lb"],
        ["Side plank","3×20 sec/side"]]},
      {day:"Thu", label:"Session B", ex:[
        ["Deadlift","4×5 @ 75–85 lb"],
        ["Bulgarian split squat (loaded)","3×8/side @ 10–15 lb DB"],
        ["Bench press","4×8 @ 30–40 lb"],
        ["Assisted pull-up","3×6–8"],
        ["Bent-over row","3×8 @ 40–55 lb"],
        ["Farmer carry","3×30 sec @ 25–30 lb DB"]]},
    ],
    wed:"Mobility/balance/posture + single-leg RDL 3×8/side @ 10–15 lb + tai chi or yoga.",
    impact:{title:"Impact block — Tue (start week 3 or 4)", body:"<b>Week 3:</b> small hops in place 2×10 · box step-downs 15–20 cm 2×8.<br><b>Week 4:</b> box step-downs 20–25 cm 3×8 · low-intensity broad jumps 2×5 · assisted jumping chin-ups 2×5."}
  },
  {
    name:"Weeks 5–6 · Heavy-Resistance Entry", weeks:[5,6],
    note:"The 5×5 heavy-stimulus pattern begins, targeting ~80–85% of your 1-rep max. Impact block now runs Tue AND Fri (25 min). Wed: yoga/tai chi + posture + balance.",
    sessions:[
      {day:"Mon", label:"Session A — 5×5 pattern", ex:[
        ["Back squat","5×5 @ 65–80 lb · target 80–85% 1RM"],
        ["Deadlift","5×5 @ 85–100 lb"],
        ["Overhead press","5×5 @ 30–40 lb"],
        ["Front squat","3×6 @ 40–50 lb"],
        ["Face pull","3×12"],
        ["Standing calf raise (loaded)","3×12 @ 25–35 lb"]]},
      {day:"Thu", label:"Session B — 5×5 pattern", ex:[
        ["Deadlift","5×5 @ 90–100 lb"],
        ["Back squat","5×5 @ 65–80 lb"],
        ["Bench press","4×6 @ 40–55 lb"],
        ["Pull-up (assisted → unassisted)","4×5"],
        ["Bulgarian split squat","3×8/side @ 15–20 lb DB"],
        ["Deadbug","3×10"]]},
    ],
    wed:"Yoga/tai chi + posture correctives + balance work.",
    impact:{title:"Impact block — Tue AND Fri (25 min)", body:"Warm-up 5 min · <b>drop jumps from 5 cm</b> 3×8 (rest 45 sec) · <b>standing broad jumps</b> 3×5 · <b>assisted jumping chin-ups</b> 3×5 · cool-down 5 min."}
  },
  {
    name:"Weeks 7–8 · Full Heavy Consistency", weeks:[7,8],
    note:"Full heavy-resistance loading — real 80–85% 1RM territory. Impact block Tue AND Fri (25–30 min). End of week 8: deload (drop all loads 20% for a week, reassess form).",
    sessions:[
      {day:"Mon", label:"Session A", ex:[
        ["Back squat","5×5 @ 75–90 lb"],
        ["Deadlift","5×5 @ 95–110 lb"],
        ["Overhead press","5×5 @ 35–45 lb"],
        ["Front squat","3×5 @ 50–65 lb"],
        ["Weighted plank","3×30 sec @ 15–25 lb"],
        ["Standing calf raise (loaded)","3×15 @ 30–40 lb"]]},
      {day:"Thu", label:"Session B", ex:[
        ["Deadlift","5×5 @ 100–115 lb"],
        ["Back squat","5×5 @ 75–90 lb"],
        ["Bench press","4×5 @ 45–60 lb"],
        ["Pull-up (assisted or unassisted)","4×5"],
        ["Bulgarian split squat","3×8/side @ 20–25 lb DB"],
        ["Suitcase carry","3×40 sec/side @ 30–40 lb"]]},
    ],
    wed:"Yoga/tai chi + posture + balance.",
    impact:{title:"Impact block — Tue AND Fri (25–30 min)", body:"Warm-up 5 min · <b>drop jumps from 10 cm</b> 5×10 (rest 30 sec) · <b>standing broad jumps</b> 3×5 · <b>jumping chin-ups</b> 3×5–10 (toward unassisted) · cool-down 5 min."}
  },
];

const TRAVEL = [
  {t:"Travel #1 · Bodyweight Strength (30 min)", b:"Bodyweight squats 4×15 (3s down, 1s up) · split squats 4×10/leg · push-ups 4×8–15 · glute bridges 4×15 · dead bugs 3×10/side · plank 3×45 sec."},
  {t:"Travel #2 · Impact + Plyo (20–25 min)", b:"Standing broad jumps 5×5 · vertical jumps 3×8 · lateral skater bounds 3×10 · jumping split squats 3×10 · fast feet 3×30 sec. <i>Only if you have already started impact loading (weeks 3+).</i>"},
  {t:"Travel #3 · HIIT Full-Body (30 min)", b:"20-min circuit, 40s work / 20s rest × 4 rounds: burpees · jumping lunges · mountain climbers · push-ups · squat jumps. Finish with a plank hold."},
  {t:"Travel #4 · Yoga / Mobility Flow (45 min)", b:"Sun salutations ×5 · warrior sequence (1/2/3 each side) · balance (tree, eagle, standing splits) · chair pose 3×30 sec · bridge→wheel · savasana. Vinyasa/Ashtanga pace, not just gentle stretching."},
  {t:"Travel #5 · Cardio + Core (30 min)", b:"Run 20 min · core circuit 8 min (plank 45s · side plank 30s/side · dead bug 10/side · bird dog 10/side, ×3)."},
];

let active = 0;

function key(p){ return "sp8_"+p; }
function getV(k){ return localStorage.getItem(key(k)) || ""; }
function setV(k,v){ v ? localStorage.setItem(key(k),v) : localStorage.removeItem(key(k)); }

function render(){
  const tabs = document.getElementById('tabs');
  const labels = ["Wk 1–2","Wk 3–4","Wk 5–6","Wk 7–8","Guide","Travel"];
  tabs.innerHTML = labels.map((l,i)=>`<div class="tab ${i===active?'active':''}" onclick="active=${i};render()">${l}</div>`).join('');
  const view = document.getElementById('view');
  if(active===4){ view.innerHTML = guideHTML(); return; }
  if(active===5){ view.innerHTML = TRAVEL.map(t=>`<div class="modcard"><h3>${t.t}</h3>${t.b}</div>`).join(''); return; }

  const ph = PROGRAM[active];
  let h = `<div class="phase-note">${ph.note}</div>`;
  ph.sessions.forEach((s,si)=>{
    h += `<div class="session"><div class="day">${s.day}</div><h2>${s.label}</h2><div class="weeks">`;
    ph.weeks.forEach((wk,wi)=>{
      const k = `done_${active}_${si}_${wi}`, on = getV(k)==="1";
      h += `<label class="wk ${on?'checked':''}"><input type="checkbox" ${on?'checked':''} onchange="setV('${k}',this.checked?'1':'');render()">Week ${wk} done</label>`;
    });
    h += `</div><table>`;
    s.ex.forEach((e,ei)=>{
      const k = `wt_${active}_${si}_${ei}`;
      h += `<tr><td class="ex"><div class="exname">${e[0]}</div><div class="presc">${e[1]}</div></td><td class="wt"><input inputmode="decimal" placeholder="lb" value="${getV(k)}" onchange="setV('${k}',this.value)"></td></tr>`;
    });
    h += `</table>`;
    const nk = `note_${active}_${si}`;
    h += `<textarea class="notes" placeholder="Notes (how it felt, form cues, tweaks)…" onchange="setV('${nk}',this.value)">${getV(nk)}</textarea>`;
    h += `</div>`;
  });
  if(ph.impact) h += `<div class="modcard impact"><h3>${ph.impact.title}</h3>${ph.impact.body}</div>`;
  h += `<div class="modcard"><h3>Wed · Mobility / Balance / Posture (30 min)</h3>${ph.wed}</div>`;
  view.innerHTML = h;
}

function guideHTML(){
  return `
  <div class="rule"><h3>Before &amp; between sets</h3><ul>
    <li>Warm up 5–10 min (light cardio + dynamic stretches) before every resistance session.</li>
    <li>Rest 2–3 min between heavy 5-rep sets; 60–90 sec between lighter sets.</li>
    <li>Sessions target ~45–50 min including warm-up and cool-down.</li>
  </ul></div>
  <div class="rule"><h3>Progression</h3><ul>
    <li>Add 2.5–5 lb the next session once you complete all sets at the target reps.</li>
    <li>Deload every 4–6 weeks: drop all loads 20% for a week.</li>
    <li>Re-assess progress at 8–12 months — strength gains are the near-term marker to watch.</li>
  </ul></div>
  <div class="rule warn"><h3>Extend a phase if any of these show up</h3><ul>
    <li>Joint pain lingering beyond normal soreness</li>
    <li>Form breaking down at the target weights</li>
    <li>Soreness (DOMS) still affecting the next session</li>
    <li>Sleep disruption or an elevated resting heart rate</li>
    <li>A bad-energy day — bail on the session and come back fresher</li>
  </ul></div>
  <div class="rule warn"><h3>Don't rush</h3>
    Patience is the load-bearing safety mechanism. Getting to full intensity with bulletproof form
    beats getting there weeks earlier and risking an injury. The ranges are wide on purpose — stay
    at the lower end until a weight feels genuinely easy for all sets.
  </div>`;
}

render();
</script>
</body>
</html>
