<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, sans-serif">
  <rect width="760" height="540" fill="#f5f1e8"/>

  <text x="20" y="32" font-size="20" font-weight="700" fill="#2a2a2a">Basement (Walkout) — v2</text>
  <text x="20" y="52" font-size="12" fill="#666">east wall = full-width walkout · SE office (fireplace S wall) · NE guest · W half = mech/bath/pantry</text>

  <g transform="translate(700,40)">
    <circle r="18" fill="#fff" stroke="#888" stroke-width="1"/>
    <text y="-4" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">N</text>
    <text y="14" text-anchor="middle" font-size="9" fill="#666">↑</text>
  </g>

  <!-- Earth berm pattern (W/N/S sides) -->
  <pattern id="berm" patternUnits="userSpaceOnUse" width="8" height="8">
    <rect width="8" height="8" fill="#d4c08a"/>
    <path d="M 0 8 L 8 0" stroke="#b8a070" stroke-width="0.5"/>
  </pattern>
  <rect x="40" y="70" width="40" height="424" fill="url(#berm)"/>
  <rect x="80" y="50" width="576" height="40" fill="url(#berm)"/>
  <rect x="80" y="474" width="576" height="40" fill="url(#berm)"/>
  <text x="55" y="280" font-size="10" font-weight="600" fill="#7a5a2a" transform="rotate(-90 55 280)">earth-bermed (uphill)</text>
  <text x="368" y="78" text-anchor="middle" font-size="10" font-weight="600" fill="#7a5a2a">earth-bermed</text>
  <text x="368" y="495" text-anchor="middle" font-size="10" font-weight="600" fill="#7a5a2a">earth-bermed</text>

  <!-- East walkout patio (full-width along east wall) -->
  <rect x="656" y="90" width="80" height="384" fill="#a8c8a8" opacity="0.5" stroke="#7a9a7a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="696" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#3a6a3a" transform="rotate(-90 696 280)">EAST PATIO · walkout · view</text>

  <!-- Building footprint -->
  <rect x="80" y="90" width="576" height="384" fill="#fff" stroke="#222" stroke-width="3"/>

  <!-- ===== WESTERN HALF (24'): mech + bath + pantry ===== -->
  <!-- per Faith: pantry can be sectioned off from mech if it makes sense -->

  <!-- Mechanical room (NW corner): x=80-260, y=90-244 (15' × 13') -->
  <rect x="80" y="90" width="180" height="154" fill="#d8d4c0" stroke="#222" stroke-width="1.5"/>
  <text x="170" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#5a5a3a">MECHANICAL</text>
  <text x="170" y="138" text-anchor="middle" font-size="10" fill="#5a5a3a">15' × 13'</text>
  <text x="170" y="158" text-anchor="middle" font-size="9" fill="#5a5a3a">radiant manifold</text>
  <text x="170" y="172" text-anchor="middle" font-size="9" fill="#5a5a3a">water heater · panel</text>
  <text x="170" y="186" text-anchor="middle" font-size="9" fill="#5a5a3a">heat-pump indoor unit</text>
  <text x="170" y="200" text-anchor="middle" font-size="9" fill="#5a5a3a">future battery / inverter</text>
  <text x="170" y="220" text-anchor="middle" font-size="9" font-style="italic" fill="#888">vented · acoustically isolated</text>

  <!-- Pantry (sectioned off from mech, immediately south): x=80-260, y=244-330 (15' × 7') -->
  <rect x="80" y="244" width="180" height="86" fill="#f0e6d0" stroke="#222" stroke-width="1.5"/>
  <text x="170" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5a2a">PANTRY</text>
  <text x="170" y="288" text-anchor="middle" font-size="10" fill="#7a5a2a">15' × 7'</text>
  <text x="170" y="304" text-anchor="middle" font-size="9" fill="#7a5a2a">walk-in · shelving for jars/cans/boxes</text>
  <text x="170" y="318" text-anchor="middle" font-size="9" font-style="italic" fill="#888">stair from kitchen above lands here</text>

  <!-- Stair from above: lands in pantry/center spine — x=260-340, y=244-330 -->
  <rect x="260" y="244" width="80" height="86" fill="#f5f5e0" stroke="#222" stroke-width="1.5"/>
  <text x="300" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5a2a">STAIR UP</text>
  <text x="300" y="286" text-anchor="middle" font-size="9" fill="#7a5a2a">to first floor</text>
  <g stroke="#999" stroke-width="0.6">
    <line x1="265" y1="298" x2="335" y2="298"/>
    <line x1="265" y1="306" x2="335" y2="306"/>
    <line x1="265" y1="314" x2="335" y2="314"/>
    <line x1="265" y1="322" x2="335" y2="322"/>
  </g>

  <!-- Full bath: x=80-260, y=330-410 (15' × 7') -->
  <rect x="80" y="330" width="180" height="80" fill="#dde0e8" stroke="#222" stroke-width="1.5"/>
  <text x="170" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4a8a">FULL BATH</text>
  <text x="170" y="374" text-anchor="middle" font-size="10" fill="#3a4a8a">15' × 7'</text>
  <text x="170" y="390" text-anchor="middle" font-size="9" fill="#3a4a8a">tub-shower · vanity · WC</text>
  <text x="170" y="404" text-anchor="middle" font-size="9" font-style="italic" fill="#888">serves guest + office + walkout</text>

  <!-- South storage / built-ins: x=80-340, y=410-474 (~22' × 5') -->
  <rect x="80" y="410" width="260" height="64" fill="#fff5e8" stroke="#222" stroke-width="1.2"/>
  <text x="210" y="438" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5a2a">storage / built-ins (S wall)</text>
  <text x="210" y="454" text-anchor="middle" font-size="9" fill="#7a5a2a">seasonal · long-term · cellar overflow</text>

  <!-- Center north strip (between mech and walkout zone): x=260-440, y=90-244 -->
  <rect x="260" y="90" width="180" height="154" fill="#fff5e8" stroke="#222" stroke-width="1.2"/>
  <text x="350" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5a2a">storage / utility</text>
  <text x="350" y="138" text-anchor="middle" font-size="9" fill="#7a5a2a">timber drying / shop adjuncts</text>
  <text x="350" y="154" text-anchor="middle" font-size="9" fill="#7a5a2a">chest freezer · bulk storage</text>

  <!-- ===== EASTERN HALF: office (SE) + guest (NE) + walkout zone (middle) ===== -->
  <!-- East strip total: x=440-656, y=90-474 -->

  <!-- NE guest bedroom: x=440-656, y=90-244 (18' × 13') -->
  <rect x="440" y="90" width="216" height="154" fill="#dde0e8" stroke="#222" stroke-width="1.5"/>
  <text x="548" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4a8a">NE GUEST BEDROOM</text>
  <text x="548" y="138" text-anchor="middle" font-size="10" fill="#3a4a8a">18' × 13' · 234 sf</text>
  <text x="548" y="158" text-anchor="middle" font-size="9" fill="#3a4a8a">east window/door · daylight</text>
  <text x="548" y="172" text-anchor="middle" font-size="9" fill="#3a4a8a">queen + sitting · closet</text>
  <!-- Closet -->
  <line x1="440" y1="200" x2="540" y2="200" stroke="#222" stroke-width="1"/>
  <text x="490" y="220" text-anchor="middle" font-size="9" fill="#3a4a8a">closet</text>
  <line x1="540" y1="200" x2="540" y2="244" stroke="#222" stroke-width="1"/>

  <!-- Walkout / family / rec zone (middle east): x=440-656, y=244-330 (18' × 7') -->
  <rect x="440" y="244" width="216" height="86" fill="#fffef5" stroke="#222" stroke-width="1.5"/>
  <text x="548" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3a3a">WALKOUT / FAMILY</text>
  <text x="548" y="286" text-anchor="middle" font-size="10" fill="#3a3a3a">18' × 7' · 126 sf</text>
  <text x="548" y="302" text-anchor="middle" font-size="9" fill="#666">media · sofa facing east doors</text>
  <text x="548" y="316" text-anchor="middle" font-size="9" fill="#666">connects guest ↔ office ↔ patio</text>
  <!-- Patio doors -->
  <line x1="656" y1="265" x2="656" y2="310" stroke="#fff" stroke-width="3"/>
  <text x="640" y="288" font-size="9" fill="#3a6a3a">↓ patio doors</text>

  <!-- SE office / library: x=440-656, y=330-474 (18' × 12') -->
  <rect x="440" y="330" width="216" height="144" fill="#d8e0d8" stroke="#222" stroke-width="1.5"/>
  <text x="548" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#1a4a3a">SE OFFICE / LIBRARY</text>
  <text x="548" y="378" text-anchor="middle" font-size="10" fill="#2a5a4a">18' × 12' · 216 sf</text>
  <text x="548" y="396" text-anchor="middle" font-size="9" fill="#2a5a4a">east walkout daylight · 2 windows</text>
  <text x="548" y="410" text-anchor="middle" font-size="9" fill="#2a5a4a">acoustic-treated walls · video-call ready</text>
  <text x="548" y="424" text-anchor="middle" font-size="9" fill="#2a5a4a">built-in bookshelves on east + west walls</text>

  <!-- Fireplace on south wall of office (Faith's spec) -->
  <rect x="500" y="445" width="100" height="29" fill="#7a6c5a" stroke="#222" stroke-width="1.2"/>
  <text x="550" y="464" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">FIELDSTONE FIREPLACE</text>
  <text x="548" y="490" text-anchor="middle" font-size="9" font-style="italic" fill="#888">[atmospheric · proper damper · stone from property]</text>

  <!-- Window seat on east of office -->
  <rect x="640" y="370" width="16" height="80" fill="#d4c8a8" stroke="#666" stroke-width="0.6"/>
  <text x="600" y="420" text-anchor="middle" font-size="9" fill="#2a5a4a">window seat →</text>
  <text x="548" y="440" text-anchor="middle" font-size="8" font-style="italic" fill="#888">reading nook</text>

  <!-- Dimensions -->
  <text x="368" y="528" text-anchor="middle" font-size="11" font-weight="600" fill="#444">48'-0"</text>
  <text x="22" y="282" font-size="11" font-weight="600" fill="#444" transform="rotate(-90 22 282)">32'-0"</text>
</svg>
