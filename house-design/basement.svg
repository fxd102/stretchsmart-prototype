<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" font-family="-apple-system, sans-serif">
  <rect width="920" height="580" fill="#f5f1e8"/>

  <text x="20" y="32" font-size="20" font-weight="700" fill="#2a2a2a">Basement (Walkout) — v3</text>
  <text x="20" y="52" font-size="12" fill="#666">stair lands NW (W half of N wall) · NE guest · SE office (fireplace S) · mudroom above on slab</text>

  <g transform="translate(880,40)">
    <circle r="18" fill="#fff" stroke="#888" stroke-width="1"/>
    <text y="-4" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">N</text>
    <text y="14" text-anchor="middle" font-size="9" fill="#666">↑</text>
  </g>

  <pattern id="berm" patternUnits="userSpaceOnUse" width="8" height="8">
    <rect width="8" height="8" fill="#d4c08a"/>
    <path d="M 0 8 L 8 0" stroke="#b8a070" stroke-width="0.5"/>
  </pattern>
  <rect x="140" y="70" width="40" height="424" fill="url(#berm)"/>
  <rect x="180" y="50" width="576" height="40" fill="url(#berm)"/>
  <rect x="180" y="474" width="576" height="40" fill="url(#berm)"/>
  <text x="155" y="280" font-size="10" font-weight="600" fill="#7a5a2a" transform="rotate(-90 155 280)">earth-bermed (uphill)</text>
  <text x="468" y="78" text-anchor="middle" font-size="10" font-weight="600" fill="#7a5a2a">earth-bermed</text>
  <text x="468" y="495" text-anchor="middle" font-size="10" font-weight="600" fill="#7a5a2a">earth-bermed</text>

  <!-- Mudroom bumpout above (no basement under) — ghost outline -->
  <rect x="36" y="212" width="144" height="144" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="108" y="284" text-anchor="middle" font-size="9" fill="#bbb" font-style="italic">mudroom bumpout above</text>
  <text x="108" y="298" text-anchor="middle" font-size="9" fill="#bbb" font-style="italic">(slab-on-grade · no basement)</text>

  <!-- East walkout patio -->
  <rect x="756" y="90" width="124" height="384" fill="#a8c8a8" opacity="0.5" stroke="#7a9a7a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="818" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#3a6a3a" transform="rotate(-90 818 280)">EAST PATIO · walkout · view</text>

  <!-- Building footprint -->
  <rect x="180" y="90" width="576" height="384" fill="#fff" stroke="#222" stroke-width="3"/>

  <!-- ==== STAIR UP from basement to first floor ==== -->
  <!-- Lands directly under the first floor stair: W half of N wall, x=252-396 -->
  <rect x="252" y="90" width="144" height="48" fill="#f5f5e0" stroke="#222" stroke-width="1.5"/>
  <text x="324" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5a2a">STAIR UP to first floor</text>
  <g stroke="#999" stroke-width="0.6">
    <line x1="262" y1="118" x2="386" y2="118"/>
    <line x1="262" y1="124" x2="386" y2="124"/>
    <line x1="262" y1="130" x2="386" y2="130"/>
  </g>
  <text x="324" y="134" text-anchor="middle" font-size="8" fill="#888">12' × 4' under first-floor stair · "behind" guest room</text>

  <!-- ==== MECHANICAL (NW corner) ==== -->
  <rect x="180" y="90" width="72" height="180" fill="#d8d4c0" stroke="#222" stroke-width="1.5"/>
  <text x="216" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#5a5a3a">MECHANICAL</text>
  <text x="216" y="138" text-anchor="middle" font-size="9" fill="#5a5a3a">6' × 15'</text>
  <text x="216" y="156" text-anchor="middle" font-size="9" fill="#5a5a3a">radiant manifold</text>
  <text x="216" y="170" text-anchor="middle" font-size="9" fill="#5a5a3a">water heater</text>
  <text x="216" y="184" text-anchor="middle" font-size="9" fill="#5a5a3a">electrical panel</text>
  <text x="216" y="198" text-anchor="middle" font-size="9" fill="#5a5a3a">heat-pump indoor</text>
  <text x="216" y="212" text-anchor="middle" font-size="9" fill="#5a5a3a">battery / inverter</text>
  <text x="216" y="232" text-anchor="middle" font-size="8" font-style="italic" fill="#888">vented · acoustic</text>
  <text x="216" y="248" text-anchor="middle" font-size="8" font-style="italic" fill="#888">isolation</text>

  <!-- ==== PANTRY (north center, between stair landing and ceiling/storage) ==== -->
  <rect x="396" y="90" width="144" height="48" fill="#f0e6d0" stroke="#222" stroke-width="1.5"/>
  <text x="468" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5a2a">PANTRY</text>
  <text x="468" y="128" text-anchor="middle" font-size="8" fill="#888">12' × 4'</text>

  <!-- Wider pantry/storage extending south -->
  <rect x="252" y="138" width="288" height="60" fill="#f0e6d0" stroke="#222" stroke-width="1.2"/>
  <text x="396" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5a2a">PANTRY (extended) / DRY STORAGE</text>
  <text x="396" y="184" text-anchor="middle" font-size="9" fill="#7a5a2a">walk-in · sized shelving for jars · cans · boxes</text>

  <!-- ==== FULL BATH ==== -->
  <rect x="180" y="270" width="156" height="80" fill="#dde0e8" stroke="#222" stroke-width="1.5"/>
  <text x="258" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4a8a">FULL BATH</text>
  <text x="258" y="314" text-anchor="middle" font-size="10" fill="#3a4a8a">13' × 7'</text>
  <text x="258" y="330" text-anchor="middle" font-size="9" fill="#3a4a8a">tub-shower · vanity · WC</text>
  <text x="258" y="344" text-anchor="middle" font-size="9" font-style="italic" fill="#888">serves guest + office + walkout</text>

  <!-- ==== STORAGE / FLEX (SW) ==== -->
  <rect x="180" y="350" width="360" height="124" fill="#fff5e8" stroke="#222" stroke-width="1.2"/>
  <text x="360" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5a2a">STORAGE / FLEX / WORKSHOP</text>
  <text x="360" y="408" text-anchor="middle" font-size="10" fill="#7a5a2a">~30' × 10' · earth-bermed (no daylight)</text>
  <text x="360" y="426" text-anchor="middle" font-size="9" fill="#7a5a2a">timber drying · seasonal · cellar overflow</text>
  <text x="360" y="442" text-anchor="middle" font-size="9" fill="#7a5a2a">workout / hobby option · future expansion</text>

  <!-- ==== NE GUEST BEDROOM ==== -->
  <rect x="540" y="138" width="216" height="120" fill="#dde0e8" stroke="#222" stroke-width="1.5"/>
  <text x="648" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4a8a">NE GUEST BEDROOM</text>
  <text x="648" y="184" text-anchor="middle" font-size="10" fill="#3a4a8a">18' × 10' · 180 sf</text>
  <text x="648" y="204" text-anchor="middle" font-size="9" fill="#3a4a8a">east window/door · daylight</text>
  <text x="648" y="218" text-anchor="middle" font-size="9" fill="#3a4a8a">queen + sitting · closet</text>
  <line x1="540" y1="234" x2="640" y2="234" stroke="#222" stroke-width="1"/>
  <text x="590" y="252" text-anchor="middle" font-size="9" fill="#3a4a8a">closet</text>
  <line x1="640" y1="234" x2="640" y2="258" stroke="#222" stroke-width="1"/>

  <!-- ==== STAIR ZONE ABOVE NE GUEST (overhang from first-floor stair?) ==== -->
  <!-- Actually no — first floor stair UP to loft is east half N wall, sits OVER the north strip of basement -->
  <!-- That north strip above guest is just storage/utility, the stair overhead is between FF and loft -->
  <rect x="540" y="90" width="216" height="48" fill="#f5f5e0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <text x="648" y="116" text-anchor="middle" font-size="9" fill="#888" font-style="italic">[first-floor stair UP to loft above this strip]</text>
  <text x="648" y="130" text-anchor="middle" font-size="8" fill="#aaa">basement ceiling here is dropped under stair</text>

  <!-- ==== WALKOUT / FAMILY (middle east) ==== -->
  <rect x="540" y="258" width="216" height="80" fill="#fffef5" stroke="#222" stroke-width="1.5"/>
  <text x="648" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3a3a">WALKOUT / FAMILY</text>
  <text x="648" y="302" text-anchor="middle" font-size="10" fill="#3a3a3a">18' × 7'</text>
  <text x="648" y="318" text-anchor="middle" font-size="9" fill="#666">media · sofa east · patio doors</text>
  <line x1="756" y1="278" x2="756" y2="320" stroke="#fff" stroke-width="3"/>
  <text x="730" y="302" font-size="9" fill="#3a6a3a">→ patio</text>

  <!-- ==== SE OFFICE / LIBRARY ==== -->
  <rect x="540" y="338" width="216" height="136" fill="#d8e0d8" stroke="#222" stroke-width="1.5"/>
  <text x="648" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#1a4a3a">SE OFFICE / LIBRARY</text>
  <text x="648" y="384" text-anchor="middle" font-size="10" fill="#2a5a4a">18' × 11' · 198 sf</text>
  <text x="648" y="402" text-anchor="middle" font-size="9" fill="#2a5a4a">east walkout daylight · 2 windows</text>
  <text x="648" y="416" text-anchor="middle" font-size="9" fill="#2a5a4a">acoustic-treated · video-call ready</text>
  <text x="648" y="430" text-anchor="middle" font-size="9" fill="#2a5a4a">built-in bookshelves E + W</text>

  <!-- Fireplace S wall office -->
  <rect x="600" y="445" width="100" height="29" fill="#7a6c5a" stroke="#222" stroke-width="1.2"/>
  <text x="650" y="464" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">FIELDSTONE FIREPLACE</text>

  <!-- Window seat -->
  <rect x="740" y="370" width="16" height="80" fill="#d4c8a8" stroke="#666" stroke-width="0.6"/>
  <text x="700" y="430" text-anchor="middle" font-size="9" fill="#2a5a4a">window seat →</text>

  <text x="468" y="528" text-anchor="middle" font-size="11" font-weight="600" fill="#444">48'-0"</text>
  <text x="160" y="282" font-size="11" font-weight="600" fill="#444" transform="rotate(-90 160 282)">32'-0"</text>
</svg>
