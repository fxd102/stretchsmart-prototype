  <text x="640" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#5a4a8a">DINING</text>
  <ellipse cx="640" cy="362" rx="46" ry="18" fill="none" stroke="#888" stroke-width="0.8"/>

  <text x="640" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4a3a">LIVING</text>
