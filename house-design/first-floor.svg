<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, sans-serif">
  <rect width="760" height="540" fill="#f5f1e8"/>

  <text x="20" y="32" font-size="20" font-weight="700" fill="#2a2a2a">First Floor — v2</text>
  <text x="20" y="52" font-size="12" fill="#666">~1,536 sf · entire east wall = open living/glass · bedrooms in W corners</text>

  <g transform="translate(700,40)">
    <circle r="18" fill="#fff" stroke="#888" stroke-width="1"/>
    <text y="-4" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">N</text>
    <text y="14" text-anchor="middle" font-size="9" fill="#666">↑</text>
  </g>

  <!-- Driveway (west, level entry) -->
  <g transform="translate(20,260)">
    <rect width="60" height="80" fill="#d4c8a8" stroke="#a89968" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="30" y="34" text-anchor="middle" font-size="10" fill="#666">driveway</text>
    <text x="30" y="48" text-anchor="middle" font-size="10" fill="#666">(level)</text>
    <text x="30" y="62" text-anchor="middle" font-size="9" fill="#888">→ entry</text>
  </g>

  <!-- East deck (view) -->
  <g transform="translate(656,90)">
    <rect width="80" height="384" fill="#e8d9b8" stroke="#a89968" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="40" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#7a5a2a" transform="rotate(-90 40 200)">EAST DECK · view side</text>
  </g>

  <!-- 2-story east glass wall -->
  <line x1="656" y1="90" x2="656" y2="474" stroke="#3a8a8a" stroke-width="6" opacity="0.45"/>

  <!-- Building outline: 48' x 32' = 576 x 384 px @ 12px/ft -->
  <rect x="80" y="90" width="576" height="384" fill="#fff" stroke="#222" stroke-width="3"/>

  <!-- ===== WESTERN ZONE: bedrooms + service. x=80..440 (30 ft) ===== -->

  <!-- NW ADA bedroom (NW corner): x=80-260, y=90-234 (15' × 12') -->
  <rect x="80" y="90" width="180" height="144" fill="#dde8dd" stroke="#222" stroke-width="1.5"/>
  <text x="170" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1a4a3a">NW ADA BEDROOM</text>
  <text x="170" y="138" text-anchor="middle" font-size="10" fill="#2a5a4a">15' × 12'  ·  aging parent</text>
  <text x="170" y="152" text-anchor="middle" font-size="9" fill="#2a5a4a">wide doors · no thresholds</text>
  <text x="170" y="166" text-anchor="middle" font-size="9" fill="#2a5a4a">level driveway access</text>
  <!-- Closet -->
  <line x1="80" y1="200" x2="180" y2="200" stroke="#222" stroke-width="1"/>
  <text x="130" y="218" text-anchor="middle" font-size="9" fill="#2a5a4a">closet</text>
  <line x1="180" y1="200" x2="180" y2="234" stroke="#222" stroke-width="1"/>

  <!-- ADA bath: x=260-360, y=90-234 (8.3' × 12') -->
  <rect x="260" y="90" width="100" height="144" fill="#e0e8ec" stroke="#222" stroke-width="1.5"/>
  <text x="310" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#3a5a8a">ADA BATH</text>
  <text x="310" y="134" text-anchor="middle" font-size="9" fill="#3a5a8a">8' × 12'</text>
  <text x="310" y="152" text-anchor="middle" font-size="9" fill="#3a5a8a">roll-in shower</text>
  <text x="310" y="166" text-anchor="middle" font-size="9" fill="#3a5a8a">grab bars · accessible</text>
  <text x="310" y="180" text-anchor="middle" font-size="9" fill="#3a5a8a">vanity · accessible WC</text>
  <text x="310" y="216" text-anchor="middle" font-size="8" font-style="italic" fill="#888">[?] keep ADA bath, or</text>
  <text x="310" y="226" text-anchor="middle" font-size="8" font-style="italic" fill="#888">drop to shared hall bath?</text>

  <!-- Mudroom / Entry / Laundry: x=80-360, y=234-330 (23' × 8') -->
  <rect x="80" y="234" width="280" height="96" fill="#f0e6d0" stroke="#222" stroke-width="1.5"/>
  <text x="220" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5a2a">MUDROOM / ENTRY / LAUNDRY</text>
  <text x="220" y="280" text-anchor="middle" font-size="10" fill="#7a5a2a">driveway entry door · gear · coats · boots</text>
  <text x="220" y="295" text-anchor="middle" font-size="10" fill="#7a5a2a">washer + dryer · clothesline access west</text>
  <text x="220" y="313" text-anchor="middle" font-size="9" font-style="italic" fill="#888">level threshold (continuous accessible path NW bedroom ↔ entry)</text>
  <!-- Entry door -->
  <line x1="80" y1="270" x2="80" y2="300" stroke="#fff" stroke-width="3"/>
  <path d="M 80 270 Q 100 280 92 300" fill="none" stroke="#222" stroke-width="0.8"/>
  <text x="55" y="290" font-size="9" font-weight="600" fill="#444">entry</text>

  <!-- Stair down to basement: x=360-440, y=234-330 (6.7' × 8') -->
  <rect x="360" y="234" width="80" height="96" fill="#f5f5e0" stroke="#222" stroke-width="1.5"/>
  <text x="400" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5a2a">STAIR DN</text>
  <text x="400" y="272" text-anchor="middle" font-size="9" fill="#7a5a2a">to basement</text>
  <g stroke="#999" stroke-width="0.6">
    <line x1="365" y1="282" x2="435" y2="282"/>
    <line x1="365" y1="290" x2="435" y2="290"/>
    <line x1="365" y1="298" x2="435" y2="298"/>
    <line x1="365" y1="306" x2="435" y2="306"/>
    <line x1="365" y1="314" x2="435" y2="314"/>
    <line x1="365" y1="322" x2="435" y2="322"/>
  </g>

  <!-- Stair up to loft: above the bath/master corridor — x=360-440, y=90-234 (6.7' × 12') -->
  <rect x="360" y="90" width="80" height="144" fill="#fff5e0" stroke="#222" stroke-width="1.5"/>
  <text x="400" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5a2a">STAIR UP</text>
  <text x="400" y="132" text-anchor="middle" font-size="9" fill="#7a5a2a">to loft</text>
  <g stroke="#999" stroke-width="0.6">
    <line x1="365" y1="146" x2="435" y2="146"/>
    <line x1="365" y1="156" x2="435" y2="156"/>
    <line x1="365" y1="166" x2="435" y2="166"/>
    <line x1="365" y1="176" x2="435" y2="176"/>
    <line x1="365" y1="186" x2="435" y2="186"/>
    <line x1="365" y1="196" x2="435" y2="196"/>
    <line x1="365" y1="206" x2="435" y2="206"/>
    <line x1="365" y1="216" x2="435" y2="216"/>
    <line x1="365" y1="226" x2="435" y2="226"/>
  </g>

  <!-- SW master bedroom: x=80-260, y=330-450 (15' × 10') -->
  <rect x="80" y="330" width="180" height="120" fill="#e8dde0" stroke="#222" stroke-width="1.5"/>
  <text x="170" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#5a1a4a">SW MASTER</text>
  <text x="170" y="378" text-anchor="middle" font-size="10" fill="#5a2a4a">15' × 10'  ·  primary suite</text>
  <text x="170" y="394" text-anchor="middle" font-size="9" fill="#5a2a4a">south/SE view orientation</text>
  <text x="170" y="408" text-anchor="middle" font-size="9" font-style="italic" fill="#888">king bed wall on N or S</text>

  <!-- Walk-in closet: x=260-340, y=330-390 (6.7' × 5') -->
  <rect x="260" y="330" width="80" height="60" fill="#efe8d8" stroke="#222" stroke-width="1.2"/>
  <text x="300" y="354" text-anchor="middle" font-size="10" font-weight="700" fill="#7a5a2a">WALK-IN</text>
  <text x="300" y="368" text-anchor="middle" font-size="9" fill="#7a5a2a">CLOSET</text>
  <text x="300" y="382" text-anchor="middle" font-size="8" font-style="italic" fill="#888">7'×5'</text>

  <!-- Luxury bath: x=260-440, y=390-474 (15' × 7') -->
  <rect x="260" y="390" width="180" height="84" fill="#e8e0ec" stroke="#222" stroke-width="1.5"/>
  <text x="350" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#5a1a4a">LUXURY BATH</text>
  <text x="350" y="432" text-anchor="middle" font-size="9" fill="#5a2a4a">15' × 7' · multi-head shower · soaking tub</text>
  <text x="350" y="446" text-anchor="middle" font-size="9" fill="#5a2a4a">double vanity · water closet</text>

  <!-- Lower west under-bath: x=340-440, y=330-390 — small office or built-in storage -->
  <rect x="340" y="330" width="100" height="60" fill="#f0e6d0" stroke="#222" stroke-width="1"/>
  <text x="390" y="356" text-anchor="middle" font-size="10" font-weight="600" fill="#7a5a2a">linen / built-in</text>
  <text x="390" y="370" text-anchor="middle" font-size="9" fill="#7a5a2a">storage</text>

  <!-- ===== EASTERN ZONE: open living/dining/kitchen. x=440-656 (18 ft) ===== -->
  <text x="548" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#3a5a8a">OPEN LIVING / DINING / KITCHEN</text>
  <text x="548" y="135" text-anchor="middle" font-size="10" fill="#3a5a8a">18' × 32' = 576 sf · entire eastern wall = 2-story glass</text>

  <!-- Kitchen along N wall: x=440-656, y=145-180 -->
  <rect x="440" y="145" width="216" height="35" fill="#c8c0a0" stroke="#999" stroke-width="0.8"/>
  <text x="548" y="166" text-anchor="middle" font-size="10" font-weight="600" fill="#3a3a3a">KITCHEN counter / pantry / sized shelving (N wall)</text>

  <!-- Island parallel to kitchen -->
  <rect x="460" y="200" width="170" height="32" fill="#c8c0a0" stroke="#666" stroke-width="0.8"/>
  <text x="545" y="220" text-anchor="middle" font-size="10" fill="#3a3a3a">island w/ seating ↓</text>

  <!-- Dining (center) -->
  <text x="548" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#5a4a8a">DINING</text>
  <text x="548" y="295" text-anchor="middle" font-size="9" fill="#5a4a8a">casual · 4 expand to 8</text>
  <ellipse cx="548" cy="320" rx="48" ry="20" fill="none" stroke="#888" stroke-width="0.8"/>

  <!-- Living (south end) -->
  <text x="548" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4a3a">LIVING</text>
  <text x="548" y="395" text-anchor="middle" font-size="9" fill="#8a4a3a">2-story glass east</text>
  <text x="548" y="410" text-anchor="middle" font-size="8" font-style="italic" fill="#888">[no fireplace this level — fireplace</text>
  <text x="548" y="422" text-anchor="middle" font-size="8" font-style="italic" fill="#888">moved to basement office per spec]</text>

  <!-- Door to deck -->
  <line x1="656" y1="350" x2="656" y2="420" stroke="#fff" stroke-width="3"/>
  <text x="668" y="385" font-size="9" fill="#3a8a8a">→ deck</text>

  <!-- Loft footprint above (dashed) -->
  <rect x="440" y="90" width="144" height="384" fill="none" stroke="#a060a0" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
  <text x="512" y="465" text-anchor="middle" font-size="9" fill="#a060a0" opacity="0.85">loft footprint above ↑ (full N-S, 12' deep)</text>

  <!-- 2-story open-to-above strip (the east 6' below the glass, NOT under loft) -->
  <text x="620" y="450" text-anchor="middle" font-size="8" fill="#3a8a8a" opacity="0.85" transform="rotate(-90 620 450)">↑ open to above (east 6')</text>

  <!-- Dimensions -->
  <text x="368" y="510" text-anchor="middle" font-size="11" font-weight="600" fill="#444">48'-0" wide (W↔E)</text>
  <text x="20" y="282" font-size="11" font-weight="600" fill="#444" transform="rotate(-90 20 282)">32'-0" deep (N↔S)</text>

  <!-- Legend -->
  <g transform="translate(20,490)">
    <rect width="14" height="10" fill="#dde8dd" stroke="#222" stroke-width="0.5"/><text x="20" y="9" font-size="9" fill="#444">ADA bedroom</text>
    <rect x="100" width="14" height="10" fill="#e8dde0" stroke="#222" stroke-width="0.5"/><text x="120" y="9" font-size="9" fill="#444">master suite</text>
    <rect x="200" width="14" height="10" fill="#f0e6d0" stroke="#222" stroke-width="0.5"/><text x="220" y="9" font-size="9" fill="#444">service</text>
    <rect x="280" width="14" height="10" fill="#fff" stroke="#222" stroke-width="0.5"/><text x="300" y="9" font-size="9" fill="#444">open living</text>
    <rect x="370" width="14" height="10" fill="#e8d9b8" stroke="#a89968" stroke-width="0.5"/><text x="390" y="9" font-size="9" fill="#444">deck</text>
    <rect x="430" width="14" height="10" fill="none" stroke="#a060a0" stroke-width="1" stroke-dasharray="3,2"/><text x="450" y="9" font-size="9" fill="#444">loft outline above</text>
  </g>
</svg>
