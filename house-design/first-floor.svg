  <text x="108" y="264" text-anchor="middle" font-size="11" font-weight="600" fill="#7a5a2a">/ LAUNDRY</text>
  <text x="108" y="284" text-anchor="middle" font-size="9" fill="#7a5a2a">12' × 12' bumpout</text>
  <text x="108" y="300" text-anchor="middle" font-size="9" fill="#7a5a2a">back-entrance vestibule</text>
  <text x="108" y="316" text-anchor="middle" font-size="9" fill="#7a5a2a">washer + dryer · gear · boots</text>
  <text x="108" y="332" text-anchor="middle" font-size="9" fill="#7a5a2a">bench · hooks · cubbies</text>
  <line x1="36" y1="270" x2="36" y2="300" stroke="#fff" stroke-width="3"/>
