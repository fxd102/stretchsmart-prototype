  <line x1="740" y1="385" x2="740" y2="445" stroke="#fff" stroke-width="3"/>
  <text x="752" y="418" font-size="9" fill="#3a8a8a">→ deck</text>

  <rect x="540" y="138" width="144" height="336" fill="none" stroke="#a060a0" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.55"/>
  <text x="612" y="465" text-anchor="middle" font-size="9" fill="#a060a0" opacity="0.85">loft outline above ↑</text>

  <text x="468" y="510" text-anchor="middle" font-size="11" font-weight="600" fill="#444">main: 48'-0" wide (W↔E)  ·  bumpout: +12' west</text>
  <text x="160" y="282" font-size="11" font-weight="600" fill="#444" transform="rotate(-90 160 282)">32'-0" deep (N↔S)</text>

  <g transform="translate(20,490)">
    <rect width="14" height="10" fill="#dde8dd" stroke="#222" stroke-width="0.5"/><text x="20" y="9" font-size="9" fill="#444">ADA bdr</text>
    <rect x="80" width="14" height="10" fill="#e8dde0" stroke="#222" stroke-width="0.5"/><text x="100" y="9" font-size="9" fill="#444">master</text>
    <rect x="160" width="14" height="10" fill="#f0e6d0" stroke="#222" stroke-width="0.5"/><text x="180" y="9" font-size="9" fill="#444">service</text>
    <rect x="240" width="14" height="10" fill="#f5f5e0" stroke="#222" stroke-width="0.5"/><text x="260" y="9" font-size="9" fill="#444">stair DN</text>
    <rect x="320" width="14" height="10" fill="#fff5e0" stroke="#222" stroke-width="0.5"/><text x="340" y="9" font-size="9" fill="#444">stair UP</text>
    <rect x="400" width="14" height="10" fill="#fff" stroke="#222" stroke-width="0.5"/><text x="420" y="9" font-size="9" fill="#444">open living</text>
    <rect x="490" width="14" height="10" fill="none" stroke="#a060a0" stroke-width="1" stroke-dasharray="3,2"/><text x="510" y="9" font-size="9" fill="#444">loft above</text>
