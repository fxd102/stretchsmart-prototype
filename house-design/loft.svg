<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, sans-serif">
  <rect width="760" height="540" fill="#f5f1e8"/>

  <text x="20" y="32" font-size="20" font-weight="700" fill="#2a2a2a">Loft / Mezzanine — v2</text>
  <text x="20" y="52" font-size="12" fill="#666">~384 sf · directly above east-strip living · full N-S width · 12' deep</text>

  <g transform="translate(700,40)">
    <circle r="18" fill="#fff" stroke="#888" stroke-width="1"/>
    <text y="-4" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">N</text>
    <text y="14" text-anchor="middle" font-size="9" fill="#666">↑</text>
  </g>

  <!-- Outline of first floor below (ghosted) -->
  <rect x="80" y="90" width="576" height="384" fill="#fff" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Ghost labels -->
  <text x="170" y="160" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">[NW ADA bedroom below]</text>
  <text x="170" y="400" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">[SW master below]</text>
  <text x="220" y="282" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">[mudroom + entry below]</text>

  <!-- Open-to-below east strip (the eastern 6 ft remains 2-story open) -->
  <rect x="584" y="90" width="72" height="384" fill="#f5f5f8" stroke="#bbb" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="620" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#888" transform="rotate(-90 620 280)">2-STORY OPEN · east glass full height</text>

  <!-- LOFT FOOTPRINT: full N-S length, 12' deep (E-W), positioned between living below and east glass -->
  <!-- x=440 to x=584 (12'), y=90 to y=474 (32') -->
  <rect x="440" y="90" width="144" height="384" fill="#e8d8e8" stroke="#222" stroke-width="2"/>

  <!-- North end of loft -->
  <text x="512" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3a5a">LOFT</text>
  <text x="512" y="158" text-anchor="middle" font-size="11" fill="#5a3a5a">12' × 32' = 384 sf</text>

  <!-- Suggested zoning along the length -->
  <line x1="440" y1="230" x2="584" y2="230" stroke="#a060a0" stroke-width="0.6" stroke-dasharray="3,2"/>
  <line x1="440" y1="350" x2="584" y2="350" stroke="#a060a0" stroke-width="0.6" stroke-dasharray="3,2"/>

  <text x="512" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#5a3a5a">YOGA / MOVEMENT</text>
  <text x="512" y="210" text-anchor="middle" font-size="9" fill="#5a3a5a">north zone · ~12' × 11' = 132 sf</text>

  <text x="512" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#5a3a5a">READING / RETREAT</text>
  <text x="512" y="295" text-anchor="middle" font-size="9" fill="#5a3a5a">center zone · against east glass</text>
  <text x="512" y="310" text-anchor="middle" font-size="9" fill="#5a3a5a">window seat · low bookshelves</text>

  <text x="512" y="395" text-anchor="middle" font-size="11" font-weight="600" fill="#5a3a5a">STUDY / MEDITATION</text>
  <text x="512" y="410" text-anchor="middle" font-size="9" fill="#5a3a5a">south zone · ~12' × 10' = 120 sf</text>
  <text x="512" y="430" text-anchor="middle" font-size="8" font-style="italic" fill="#888">(Faith: yoga vs library — TBD)</text>
  <text x="512" y="442" text-anchor="middle" font-size="8" font-style="italic" fill="#888">v2 splits the floor so you don't pick</text>

  <!-- Stair arriving (lands at central west edge of loft, matches first-floor stair) -->
  <rect x="386" y="234" width="54" height="80" fill="#f5f5e0" stroke="#222" stroke-width="1.2"/>
  <text x="413" y="260" text-anchor="middle" font-size="10" font-weight="600" fill="#7a5a2a">stair</text>
  <text x="413" y="274" text-anchor="middle" font-size="9" fill="#7a5a2a">DN</text>
  <g stroke="#999" stroke-width="0.6">
    <line x1="391" y1="282" x2="435" y2="282"/>
    <line x1="391" y1="290" x2="435" y2="290"/>
    <line x1="391" y1="298" x2="435" y2="298"/>
    <line x1="391" y1="306" x2="435" y2="306"/>
  </g>

  <!-- Loft west edge (open to below) - railing -->
  <line x1="440" y1="90" x2="440" y2="474" stroke="#222" stroke-width="2"/>
  <g stroke="#888" stroke-width="0.6">
    <line x1="435" y1="100" x2="445" y2="100"/>
    <line x1="435" y1="120" x2="445" y2="120"/>
    <line x1="435" y1="140" x2="445" y2="140"/>
    <line x1="435" y1="160" x2="445" y2="160"/>
    <line x1="435" y1="180" x2="445" y2="180"/>
    <line x1="435" y1="200" x2="445" y2="200"/>
    <line x1="435" y1="220" x2="445" y2="220"/>
    <line x1="435" y1="320" x2="445" y2="320"/>
    <line x1="435" y1="340" x2="445" y2="340"/>
    <line x1="435" y1="360" x2="445" y2="360"/>
    <line x1="435" y1="380" x2="445" y2="380"/>
    <line x1="435" y1="400" x2="445" y2="400"/>
    <line x1="435" y1="420" x2="445" y2="420"/>
    <line x1="435" y1="440" x2="445" y2="440"/>
    <line x1="435" y1="460" x2="445" y2="460"/>
  </g>
  <text x="423" y="78" font-size="9" font-style="italic" fill="#888">↓ railing · open to living below</text>

  <!-- East edge: 2-story open boundary -->
  <line x1="584" y1="90" x2="584" y2="474" stroke="#5a3a5a" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Shed roof annotation -->
  <text x="512" y="486" text-anchor="middle" font-size="9" fill="#888">shed roof slopes from S (high, solar-facing) → N (low) above this entire footprint</text>

  <!-- Note about "entire width of eastern wall" -->
  <g transform="translate(80,495)">
    <text font-size="10" fill="#444" font-weight="600">Per spec:</text>
    <text x="60" font-size="10" fill="#666">loft directly above east-strip living, takes the full width (32') of the east wall.</text>
    <text x="0" y="14" font-size="10" fill="#666">12' depth (E–W) leaves the eastern 6' open to below for the 2-story east glass to read full height.</text>
  </g>
</svg>
