<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" font-family="-apple-system, sans-serif">
  <rect width="920" height="580" fill="#f5f1e8"/>

  <text x="20" y="32" font-size="20" font-weight="700" fill="#2a2a2a">Loft / Mezzanine — v3</text>
  <text x="20" y="52" font-size="12" fill="#666">stair lands NE corner of loft (E half N wall) · loft full N–S length above east-strip living</text>

  <g transform="translate(880,40)">
    <circle r="18" fill="#fff" stroke="#888" stroke-width="1"/>
    <text y="-4" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">N</text>
    <text y="14" text-anchor="middle" font-size="9" fill="#666">↑</text>
  </g>

  <!-- Mudroom bumpout below — ghosted -->
  <rect x="36" y="212" width="144" height="144" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <text x="108" y="288" text-anchor="middle" font-size="9" fill="#bbb" font-style="italic">[mudroom bumpout below]</text>

  <!-- Outline of first floor below (ghosted) -->
  <rect x="180" y="90" width="576" height="384" fill="#fff" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,4"/>

  <text x="258" y="200" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">[NW ADA bedroom below]</text>
  <text x="258" y="400" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">[SW master below]</text>
  <text x="360" y="306" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">[central hall below]</text>

  <!-- 2-story open-to-below east strip (east 5'/60px) -->
  <rect x="696" y="138" width="60" height="336" fill="#f5f5f8" stroke="#bbb" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="726" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#888" transform="rotate(-90 726 280)">2-STORY OPEN · east glass full height</text>

  <!-- ==== LOFT FOOTPRINT ==== -->
  <!-- Sits above east-strip living, full N-S, 14' deep E-W, leaving east 5' open-to-below -->
  <!-- x=540-696 (13'), y=138-474 (28') = 364 sf — EXCLUDING the stair landing strip -->
  <rect x="540" y="138" width="156" height="336" fill="#e8d8e8" stroke="#222" stroke-width="2"/>

  <!-- Stair UP from first floor — landing on loft N edge, eastern part of N wall -->
  <!-- First floor stair UP was at x=540-684, y=90-138; lands on loft at top -->
  <rect x="540" y="90" width="144" height="48" fill="#fff5e0" stroke="#222" stroke-width="1.5"/>
  <text x="612" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5a2a">STAIR landing</text>
  <g stroke="#999" stroke-width="0.6">
    <line x1="550" y1="120" x2="674" y2="120"/>
    <line x1="550" y1="126" x2="674" y2="126"/>
    <line x1="550" y1="132" x2="674" y2="132"/>
  </g>

  <!-- LOFT zoning -->
  <line x1="540" y1="240" x2="696" y2="240" stroke="#a060a0" stroke-width="0.6" stroke-dasharray="3,2"/>
  <line x1="540" y1="360" x2="696" y2="360" stroke="#a060a0" stroke-width="0.6" stroke-dasharray="3,2"/>

  <text x="618" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3a5a">LOFT</text>
  <text x="618" y="186" text-anchor="middle" font-size="10" fill="#5a3a5a">13' × 28' = 364 sf</text>
  <text x="618" y="206" text-anchor="middle" font-size="10" font-weight="600" fill="#5a3a5a">YOGA / MOVEMENT</text>
  <text x="618" y="220" text-anchor="middle" font-size="9" fill="#5a3a5a">north zone</text>

  <text x="618" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#5a3a5a">READING / RETREAT</text>
  <text x="618" y="306" text-anchor="middle" font-size="9" fill="#5a3a5a">center zone · against east glass</text>
  <text x="618" y="320" text-anchor="middle" font-size="9" fill="#5a3a5a">window seat · low bookshelves</text>

  <text x="618" y="395" text-anchor="middle" font-size="11" font-weight="600" fill="#5a3a5a">STUDY / MEDITATION</text>
  <text x="618" y="411" text-anchor="middle" font-size="9" fill="#5a3a5a">south zone</text>

  <!-- East glass annotation continues full height -->
  <line x1="756" y1="90" x2="756" y2="474" stroke="#3a8a8a" stroke-width="6" opacity="0.45"/>
  <text x="772" y="280" font-size="11" font-weight="600" fill="#3a8a8a" transform="rotate(-90 772 280)">2-story east glass · full height continues here</text>

  <!-- South railing on loft S edge (open to S below) - actually loft is full N-S so no S railing, just walls -->
  <!-- West edge: railing (open to living below) -->
  <line x1="540" y1="138" x2="540" y2="474" stroke="#222" stroke-width="2"/>
  <g stroke="#888" stroke-width="0.6">
    <line x1="535" y1="148" x2="545" y2="148"/>
    <line x1="535" y1="168" x2="545" y2="168"/>
    <line x1="535" y1="188" x2="545" y2="188"/>
    <line x1="535" y1="208" x2="545" y2="208"/>
    <line x1="535" y1="228" x2="545" y2="228"/>
    <line x1="535" y1="248" x2="545" y2="248"/>
    <line x1="535" y1="268" x2="545" y2="268"/>
    <line x1="535" y1="288" x2="545" y2="288"/>
    <line x1="535" y1="308" x2="545" y2="308"/>
    <line x1="535" y1="328" x2="545" y2="328"/>
    <line x1="535" y1="348" x2="545" y2="348"/>
    <line x1="535" y1="368" x2="545" y2="368"/>
    <line x1="535" y1="388" x2="545" y2="388"/>
    <line x1="535" y1="408" x2="545" y2="408"/>
    <line x1="535" y1="428" x2="545" y2="428"/>
    <line x1="535" y1="448" x2="545" y2="448"/>
    <line x1="535" y1="468" x2="545" y2="468"/>
  </g>
  <text x="500" y="306" font-size="9" font-style="italic" fill="#888" transform="rotate(-90 500 306)">↓ railing · open to living below</text>

  <text x="618" y="486" text-anchor="middle" font-size="9" fill="#888">shed roof: high south (solar-facing) → low north</text>

  <g transform="translate(180,495)">
    <text font-size="10" fill="#444" font-weight="600">v3 changes:</text>
    <text x="0" y="14" font-size="10" fill="#666">stair landing now on the NE side of the loft (matches first-floor stair UP location along E half of N wall).</text>
    <text x="0" y="28" font-size="10" fill="#666">loft is 13' deep E–W (one foot wider than v2) to absorb the stair access strip; east 5' still open to below for full-height glass.</text>
  </g>
</svg>
