<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StretchSmart Nudge</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e; color: #e0e0e0;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px 24px;
  }
  .container {
    max-width: 440px; width: 100%;
    display: flex; flex-direction: column; align-items: center;
  }
  .eyebrow {
    font-size: 11px; color: #888; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 8px;
  }
  h1 {
    font-size: 28px; font-weight: 700; color: #e94560;
    text-align: center; margin-bottom: 6px; line-height: 1.2;
  }
  .duration-hint {
    font-size: 13px; color: #4ecdc4; margin-bottom: 20px;
    letter-spacing: 0.5px;
  }
  .card {
    background: #16213e; border-radius: 20px; padding: 20px;
    width: 100%; margin-bottom: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .desc {
    font-size: 15px; line-height: 1.6; color: #ccc;
    text-align: center;
  }
  .start-btn {
    width: 100%; max-width: 360px;
    padding: 26px; border-radius: 32px;
    font-size: 22px; font-weight: 700;
    background: #e94560; color: white; border: none;
    cursor: pointer; transition: transform 0.1s;
    box-shadow: 0 6px 20px rgba(233,69,96,0.35);
    margin-bottom: 18px;
  }
  .start-btn:active { transform: scale(0.96); }
  .choosers {
    display: flex; gap: 8px; width: 100%;
  }
  .chooser {
    flex: 1; padding: 14px 6px;
    background: #2a2a4a; color: #aaa;
    border: 1px solid #3a3a5a; border-radius: 18px;
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
    text-align: center;
  }
  .chooser:hover {
    background: #1a3a5c; color: #6db3f2; border-color: #4ecdc4;
  }
  .timer-wrap {
    display: none; width: 100%; text-align: center;
  }
  .timer-wrap.show { display: block; }
  .phase-label {
    font-size: 16px; font-weight: 600; color: #e9a045;
    margin-bottom: 8px; min-height: 24px;
  }
  .phase-progress {
    font-size: 11px; color: #888; margin-bottom: 4px;
  }
  .timer-ring {
    width: 200px; height: 200px; position: relative;
    margin: 8px auto;
  }
  .timer-ring svg { transform: rotate(-90deg); }
  .timer-text {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px; font-weight: 700; color: #fff;
  }
  .total-remaining {
    font-size: 12px; color: #666; margin-top: 4px;
  }
  .feedback {
    display: none; gap: 8px; width: 100%; margin-top: 16px;
  }
  .feedback.show { display: flex; }
  .fb-btn {
    flex: 1; padding: 14px;
    background: #2a2a4a; color: #e0e0e0;
    border: 1px solid #3a3a5a; border-radius: 18px;
    font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  .fb-btn.too-easy { border-color: #4ecdc4; }
  .fb-btn.doable { border-color: #e9a045; }
  .fb-btn.couldnt { border-color: #e94560; }
  .fb-btn:active { transform: scale(0.96); }
  .done-msg {
    display: none; text-align: center; padding: 20px 0;
    color: #4ecdc4; font-size: 17px;
  }
  .done-msg.show { display: block; }
  .back-link {
    font-size: 12px; color: #888; text-decoration: none;
    margin-top: 28px;
  }
  .hook {
    font-size: 15px; color: #ccc; font-style: italic;
    text-align: center; margin-bottom: 12px;
    line-height: 1.5; min-height: 22px;
  }
  .insight-card {
    display: none; background: #16213e; border-radius: 16px;
    padding: 18px; width: 100%; margin-bottom: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    border-left: 3px solid #4ecdc4;
  }
  .insight-card.show { display: block; }
  .insight-text {
    font-size: 14px; color: #ccc; line-height: 1.6;
    margin-bottom: 8px;
  }
  .insight-src {
    font-size: 11px; color: #888; font-style: italic;
  }
  .illustration {
    width: 160px; height: 160px;
    margin: 0 auto 16px;
  }
  .illustration img {
    width: 100%; height: 100%;
  }
  .back-link:hover { color: #e94560; }
  /* two-screen flow */
  #nudge-screen { width: 100%; display: flex; flex-direction: column; align-items: center; }
  #nudge-screen.hide { display: none; }
  #detail-screen { display: none; width: 100%; flex-direction: column; align-items: center; }
  #detail-screen.show { display: flex; }
  .detail-name {
    font-size: 20px; font-weight: 700; color: #e94560;
    text-align: center; margin-bottom: 4px; line-height: 1.2;
  }
  /* clinical cues — compact tappable chips that reveal dense text on demand */
  .cues { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-bottom: 4px; }
  .cue {
    padding: 13px 10px; border-radius: 14px;
    background: #16213e; color: #cfd3dc; border: 1px solid #2a3050;
    font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
    transition: all 0.12s;
  }
  .cue:active { transform: scale(0.97); }
  .cue.active { border-color: #4ecdc4; color: #4ecdc4; }
  .cue.stop { border-color: #6e2233; color: #f08aa0; }
  .cue.stop.active { border-color: #e94560; color: #e94560; }
  .cue-panel { width: 100%; }
  .cue-body {
    background: #16213e; border-radius: 14px; padding: 14px 16px; margin-top: 8px;
    border-left: 3px solid #4ecdc4; text-align: left;
    font-size: 14px; line-height: 1.55; color: #ddd;
  }
  .cue-body.stop { border-left-color: #e94560; background: #251820; }
  .cue-title {
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    color: #4ecdc4; font-weight: 700; margin-bottom: 5px;
  }
  .cue-body.stop .cue-title { color: #e94560; }
  .draft-flag {
    font-size: 11px; color: #888; font-style: italic;
    text-align: center; margin-bottom: 20px; min-height: 14px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">StretchSmart</div>

    <!-- SCREEN 1: the nudge — exercise name + motivation -->
    <div id="nudge-screen">
      <p class="hook" id="hook"></p>
      <h1 id="ex-name">Loading…</h1>
      <div class="insight-card" id="insight-card" style="margin-bottom:18px;">
        <p class="insight-text" id="insight-text"></p>
        <p class="insight-src" id="insight-src"></p>
      </div>
      <button class="start-btn" id="start-btn" onclick="showDetail()">Let's Go</button>
      <div class="choosers" id="choosers"></div>
    </div>

    <!-- SCREEN 2: the detail — animation + timer above the fold; instructions
         and clinical cues below (dense text tucked behind tappable cue chips) -->
    <div id="detail-screen">
      <div class="detail-name" id="detail-name"></div>
      <div class="duration-hint" id="ex-duration"></div>

      <div class="illustration" id="ex-illust"></div>

      <div class="timer-wrap" id="timer-wrap">
        <div class="phase-label" id="phase-label"></div>
        <div class="phase-progress" id="phase-progress"></div>
        <div class="timer-ring">
          <svg width="200" height="200">
            <circle cx="100" cy="100" r="90" fill="none" stroke="#2a2a4a" stroke-width="8"/>
            <circle id="ring" cx="100" cy="100" r="90" fill="none" stroke="#e94560" stroke-width="8"
              stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="0"/>
          </svg>
          <div class="timer-text" id="timer-text">—</div>
        </div>
        <div class="total-remaining" id="total-remaining"></div>
      </div>

      <div class="card">
        <p class="desc" id="ex-desc">&nbsp;</p>
      </div>

      <div class="cues" id="ex-cues"></div>
      <div class="cue-panel" id="cue-panel"></div>
      <div class="draft-flag" id="draft-flag"></div>

      <div class="feedback" id="feedback">
        <button class="fb-btn too-easy" onclick="submitFeedback('too-easy')">Too Easy</button>
        <button class="fb-btn doable" onclick="submitFeedback('doable')">Doable</button>
        <button class="fb-btn couldnt" onclick="submitFeedback('couldnt')">Couldn't</button>
      </div>

      <div class="done-msg" id="done-msg">
        ✓ Logged. Same exercise on your next nudge today.
      </div>
    </div>

    <a class="back-link" href="/stretchsmart-prototype/">← Back to StretchSmart</a>
  </div>

<script>
const CIRC = 565.5; // 2 * pi * 90
let exercises = [];
let exercise = null;
let currentIdx = 0;
let timerId = null;
let audioCtx = null;

const POSITION_LABELS = {seated: 'Seated', standing: 'Standing', floor: 'Floor'};

const HOOKS = {
  morning: [
    "Your body's been waiting for this. Ready?",
    "Good morning to your muscles.",
    "You know what feels better than sitting? This.",
    "Start the day by showing up for yourself.",
  ],
  midday: [
    "Quick check-in with your body. Just a minute.",
    "Halfway through your day. Time to move.",
    "Your future self thanks you for this one.",
    "You've been great today. Keep the streak.",
  ],
  afternoon: [
    "One more today. This is the one that compounds.",
    "Almost done for the day. Let's close it out.",
    "You've already shown up. One more round.",
    "Last stretch of the day. Make it count.",
  ],
};

let insights = [];

function exerciseSlug(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
}

function totalDuration(ex) {
  return (ex.phases || []).reduce((s, p) => s + (p.seconds || 0), 0);
}

async function loadExercise() {
  exercises = await fetch('/stretchsmart-prototype/api/exercises.json').then(r => r.json());
  const params = new URLSearchParams(location.search);
  let idx = parseInt(params.get('e'));
  if (isNaN(idx) || idx < 0 || idx >= exercises.length) {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    idx = Math.floor((now - start) / 86400000) % exercises.length;
  }
  currentIdx = idx;
  exercise = exercises[idx];

  document.getElementById('ex-name').textContent = exercise.name;
  document.getElementById('detail-name').textContent = exercise.name;
  document.getElementById('ex-duration').textContent = totalDuration(exercise) + ' seconds';
  document.getElementById('ex-desc').textContent = exercise.desc;
  renderCues();

  const slug = exerciseSlug(exercise.name);
  const img = document.createElement('img');
  img.src = '/stretchsmart-prototype/img/exercises/' + slug + '.svg';
  img.alt = exercise.name;
  img.onerror = function() { document.getElementById('ex-illust').style.display = 'none'; };
  document.getElementById('ex-illust').appendChild(img);

  // Hook text based on time of day
  const hr = new Date().getHours();
  const period = hr < 11 ? 'morning' : hr < 14 ? 'midday' : 'afternoon';
  const hookList = HOOKS[period];
  document.getElementById('hook').textContent = hookList[Math.floor(Math.random() * hookList.length)];

  // Load insights and show the one most relevant to THIS exercise as motivation before starting
  try {
    insights = await fetch('/stretchsmart-prototype/api/insights.json').then(r => r.json());
  } catch (e) { insights = []; }
  showRelevantInsight();

  buildChoosers();
}

function buildChoosers() {
  const container = document.getElementById('choosers');
  container.innerHTML = '';
  const pos = exercise.position;
  Object.keys(POSITION_LABELS).forEach(key => {
    if (key === pos) return;
    const alts = exercises.filter((e, i) => e.position === key && i !== currentIdx);
    if (!alts.length) return;
    const btn = document.createElement('button');
    btn.className = 'chooser';
    btn.textContent = 'Switch to ' + POSITION_LABELS[key];
    btn.onclick = () => switchTo(key);
    container.appendChild(btn);
  });
}

function switchTo(pos) {
  const alts = exercises
    .map((e, i) => ({e, i}))
    .filter(x => x.e.position === pos && x.i !== currentIdx);
  if (!alts.length) return;
  const pick = alts[Math.floor(Math.random() * alts.length)];
  const url = new URL(location);
  url.searchParams.set('e', pick.i);
  location.href = url;
}

function playDing() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  } catch (e) {}
  try { navigator.vibrate(200); } catch (e) {}
}

function remainingFromPhase(phaseIdx, elapsedInPhase) {
  const phases = exercise.phases;
  let rem = Math.max(0, phases[phaseIdx].seconds - elapsedInPhase);
  for (let i = phaseIdx + 1; i < phases.length; i++) rem += phases[i].seconds;
  return Math.ceil(rem);
}

// Clinical cue chips: short user-facing labels that expand the dense
// PT-schema text on demand, so the animation + timer stay above the fold.
const CUE_FIELDS = [
  {key: 'form_cue',       chip: 'Form check',       title: 'Form cue',        cls: ''},
  {key: 'stop_condition', chip: 'Pain or strain?',  title: 'When to stop',    cls: 'stop'},
  {key: 'regression',     chip: 'Too hard?',        title: 'Make it easier',  cls: ''},
  {key: 'remediation',    chip: "Can't hold form?", title: 'Build up first',  cls: ''},
];
let openCueKey = null;

function renderCues() {
  const grid = document.getElementById('ex-cues');
  const panel = document.getElementById('cue-panel');
  grid.innerHTML = '';
  panel.innerHTML = '';
  openCueKey = null;
  CUE_FIELDS.filter(f => exercise[f.key]).forEach(f => {
    const chip = document.createElement('button');
    chip.className = 'cue' + (f.cls ? ' ' + f.cls : '');
    chip.textContent = f.chip;
    chip.onclick = () => toggleCue(f, chip);
    grid.appendChild(chip);
  });
  document.getElementById('draft-flag').textContent =
    exercise.validation === 'draft_pending_pt'
      ? 'Clinical guidance — draft, pending PT review' : '';
}

function toggleCue(f, chip) {
  const panel = document.getElementById('cue-panel');
  document.querySelectorAll('.cue').forEach(c => c.classList.remove('active'));
  if (openCueKey === f.key) { panel.innerHTML = ''; openCueKey = null; return; }
  openCueKey = f.key;
  chip.classList.add('active');
  const body = document.createElement('div');
  body.className = 'cue-body' + (f.cls ? ' ' + f.cls : '');
  const title = document.createElement('div');
  title.className = 'cue-title';
  title.textContent = f.title;
  const text = document.createElement('div');
  text.textContent = exercise[f.key];
  body.appendChild(title);
  body.appendChild(text);
  panel.innerHTML = '';
  panel.appendChild(body);
}

// "Let's Go" → reveal the detail screen (instructions + parameters) and run the timer.
function showDetail() {
  // Unlock audio context on user gesture (mobile Safari)
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  document.getElementById('nudge-screen').classList.add('hide');
  document.getElementById('detail-screen').classList.add('show');
  document.getElementById('timer-wrap').classList.add('show');
  runPhase(0);
}

function runPhase(phaseIdx) {
  const phases = exercise.phases;
  if (phaseIdx >= phases.length) {
    document.getElementById('timer-wrap').classList.remove('show');
    document.getElementById('feedback').classList.add('show');
    playDing();
    return;
  }

  const phase = phases[phaseIdx];
  document.getElementById('phase-label').textContent = phase.label;
  document.getElementById('phase-progress').textContent =
    phases.length > 1 ? 'Step ' + (phaseIdx + 1) + ' of ' + phases.length : '';
  document.getElementById('timer-text').textContent = phase.seconds;
  document.getElementById('ring').style.transition = 'none';
  document.getElementById('ring').style.strokeDashoffset = '0';
  // Force reflow so transition reset takes effect
  void document.getElementById('ring').offsetWidth;
  document.getElementById('ring').style.transition = 'stroke-dashoffset 0.25s linear';

  const startTime = Date.now();

  function tick() {
    const elapsed = (Date.now() - startTime) / 1000;
    const left = Math.max(0, Math.ceil(phase.seconds - elapsed));
    document.getElementById('timer-text').textContent = left;
    const frac = Math.min(1, elapsed / phase.seconds);
    document.getElementById('ring').style.strokeDashoffset = (CIRC * frac).toFixed(1);
    document.getElementById('total-remaining').textContent =
      remainingFromPhase(phaseIdx, elapsed) + 's total remaining';

    if (left <= 0) {
      clearInterval(timerId);
      if (phaseIdx < phases.length - 1) {
        playDing();
        setTimeout(() => runPhase(phaseIdx + 1), 600);
      } else {
        runPhase(phaseIdx + 1);
      }
    }
  }
  tick();
  timerId = setInterval(tick, 200);
}

// Map an exercise body_area to candidate insight category names.
// First entry is the primary; secondary entries are acceptable fallbacks.
const BODY_AREA_TO_CATEGORIES = {
  'neck': ['neck', 'posture'],
  'shoulders': ['shoulders', 'posture'],
  'upper back': ['upper back', 'posture'],
  'lower back': ['back', 'flexibility'],
  'chest': ['chest', 'breathing', 'posture'],
  'core': ['strength', 'mobility'],
  'hips': ['hips', 'mobility'],
  'glutes': ['strength', 'flexibility'],
  'quads': ['legs', 'strength'],
  'hamstrings': ['hamstrings', 'flexibility'],
  'calves/ankles': ['calves', 'mobility'],
  'wrists/hands': ['wrists', 'strength'],
  'balance': ['mobility'],
  'breathing': ['breathing', 'posture'],
  'full body': ['mobility', 'strength']
};

function showRelevantInsight() {
  if (!insights.length) return;

  // Clean up old daily keys and load today's shown-list
  const today = new Date().toISOString().slice(0, 10);
  const storageKey = 'ss_shown_insights_' + today;
  for (let k = 0; k < localStorage.length; k++) {
    const key = localStorage.key(k);
    if (key && key.startsWith('ss_shown_insights_') && key !== storageKey) {
      localStorage.removeItem(key);
    }
  }
  const shownMap = JSON.parse(localStorage.getItem(storageKey) || '{}');
  let shownForEx = shownMap[exercise.name] || [];

  const exTags = [...(exercise.concerns || []), ...(exercise.tags || [])].map(t => t.toLowerCase());
  const exArea = (exercise.body_area || '').toLowerCase();
  const preferredCats = BODY_AREA_TO_CATEGORIES[exArea] || [];

  // Score: category-match dominates (primary +8, secondary +4); position-weighted tag
  // overlap stacks on top (1st tag = 3pts, 2nd = 2pts, rest = 1pt). This fixes the
  // prior "neck stretch gets a breathing insight" failure: an insight whose primary
  // topic is neck wins over one with neck as a third-position side tag.
  function scoreInsight(ins) {
    let score = 0;
    const iCat = (ins.category || '').toLowerCase();
    if (preferredCats.length && preferredCats.includes(iCat)) {
      score += (preferredCats[0] === iCat) ? 8 : 4;
    }
    const iTags = (ins.tags || []).map(t => t.toLowerCase());
    iTags.forEach((it, idx) => {
      const matches = exTags.some(et => et.includes(it) || it.includes(et));
      if (matches) {
        score += idx === 0 ? 3 : idx === 1 ? 2 : 1;
      }
    });
    return score;
  }
  const scored = insights.map(ins => ({ins, score: scoreInsight(ins)}));

  // Tiered pools: top score, lower-but-positive, full fallback
  const maxScore = Math.max(...scored.map(s => s.score));
  const tiers = [];
  if (maxScore > 0) {
    tiers.push(scored.filter(s => s.score === maxScore).map(s => s.ins));
    const lower = scored.filter(s => s.score > 0 && s.score < maxScore).map(s => s.ins);
    if (lower.length) tiers.push(lower);
  }
  tiers.push(insights);

  // Walk tiers preferring unseen insights for this exercise today
  let pick = null;
  for (const tier of tiers) {
    const unseen = tier.filter(i => !shownForEx.includes(i.id));
    if (unseen.length) { pick = unseen[Math.floor(Math.random() * unseen.length)]; break; }
  }
  if (!pick) {
    shownForEx = [];
    pick = tiers[0][Math.floor(Math.random() * tiers[0].length)];
  }

  shownForEx = shownForEx.concat([pick.id]);
  shownMap[exercise.name] = shownForEx;
  localStorage.setItem(storageKey, JSON.stringify(shownMap));

  document.getElementById('insight-text').textContent = pick.text;
  document.getElementById('insight-src').textContent = pick.source ? '— ' + pick.source : '';
  document.getElementById('insight-card').classList.add('show');
}

function submitFeedback(val) {
  const log = JSON.parse(localStorage.getItem('ss_feedback') || '[]');
  log.push({ t: new Date().toISOString(), exercise: exercise.name, rating: val });
  localStorage.setItem('ss_feedback', JSON.stringify(log));
  document.getElementById('feedback').classList.remove('show');
  document.getElementById('done-msg').classList.add('show');
}

loadExercise();
</script>
</body>
</html>
