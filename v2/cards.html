<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Review</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e; color: #e0e0e0; min-height: 100vh;
  }
  .topbar {
    background: #16213e; padding: 12px 16px; border-bottom: 2px solid #0f3460;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-title { font-size: 15px; font-weight: 700; color: #e94560; }
  .page-content { padding: 20px 16px 40px; max-width: 640px; margin: 0 auto; }
  label { display: block; font-size: 12px; color: #888; text-transform: uppercase;
    letter-spacing: 1px; margin: 14px 0 6px; }
  select {
    width: 100%; padding: 12px; font-size: 16px; border-radius: 8px;
    background: #16213e; color: #e0e0e0; border: 1px solid #0f3460;
  }
  .ex-box { margin-top: 20px; padding: 14px; background: #16213e; border-radius: 10px; }
  .ex-name { font-size: 18px; font-weight: 700; }
  .ex-desc { font-size: 14px; color: #bbb; margin-top: 6px; line-height: 1.5; }
  .ex-meta { font-size: 12px; color: #888; margin-top: 10px; line-height: 1.6; }
  .ex-meta a { color: #e94560; }
  h2 { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px;
    margin: 24px 0 4px; }
  .hint { font-size: 12px; color: #888; margin-bottom: 10px; }
  .card { background: #16213e; border-left: 3px solid #0f3460; border-radius: 8px;
    padding: 14px; margin-top: 10px; }
  .card.first { border-left-color: #e94560; }
  .card-text { font-size: 15px; line-height: 1.55; }
  .card-src { font-size: 12px; color: #999; margin-top: 8px; font-style: italic; }
  .card-why { font-size: 11px; color: #777; margin-top: 8px; }
  .none { margin-top: 16px; padding: 14px; background: #16213e; border-radius: 8px;
    color: #bbb; font-size: 14px; }
  .error { color: #e94560; margin-top: 20px; }
  .totals { font-size: 12px; color: #888; margin-top: 6px; }
</style>
</head>
<body>
<div class="topbar"><div class="topbar-title">Card Review</div></div>
<div class="page-content">
  <div class="totals" id="totals">Loading…</div>

  <label for="area">Body part</label>
  <select id="area"></select>

  <label for="ex">Exercise</label>
  <select id="ex"></select>

  <div id="out"></div>
</div>

<script src="insight-match.js"></script>
<script>
// Review page: pick a body part, then an exercise, and see every research card it can show.
// Reads the live exercise and card files on every load, and uses the same matching rules as
// the nudge page (insight-match.js), so it always reflects what people actually see.
let exercises = [], insights = [];
const areaSel = document.getElementById('area');
const exSel = document.getElementById('ex');
const out = document.getElementById('out');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function cardsFor(ex) { return relevantInsights(ex, insights); }

function fillAreas() {
  const areas = [...new Set(exercises.map(e => e.body_area))].sort();
  areaSel.innerHTML = '';
  areas.forEach(a => {
    const n = exercises.filter(e => e.body_area === a).length;
    const o = el('option', null, a + ' (' + n + ' exercises)');
    o.value = a;
    areaSel.appendChild(o);
  });
}

function fillExercises() {
  exSel.innerHTML = '';
  exercises.forEach((e, idx) => {
    if (e.body_area !== areaSel.value) return;
    const n = cardsFor(e).length;
    const o = el('option', null, e.name + ' (' + n + (n === 1 ? ' card)' : ' cards)'));
    o.value = idx;
    exSel.appendChild(o);
  });
  showExercise();
}

function cardBox(s, first, ex) {
  const box = el('div', 'card' + (first ? ' first' : ''));
  box.appendChild(el('div', 'card-text', s.ins.text));
  if (s.ins.source) box.appendChild(el('div', 'card-src', '— ' + s.ins.source));
  const why = s.primary
    ? 'main topic for this exercise'
    : 'related topic, and shares a tag with this exercise';
  box.appendChild(el('div', 'card-why',
    'Card ' + s.ins.id + ' · topic: ' + s.ins.category + ' · ' + why));
  return box;
}

function showExercise() {
  out.innerHTML = '';
  const idx = Number(exSel.value);
  const ex = exercises[idx];
  if (!ex) return;

  const box = el('div', 'ex-box');
  box.appendChild(el('div', 'ex-name', ex.name));
  box.appendChild(el('div', 'ex-desc', ex.desc || ''));
  const meta = el('div', 'ex-meta');
  const topics = ex.insight_categories
    || BODY_AREA_TO_CATEGORIES[(ex.body_area || '').toLowerCase()] || [];
  meta.appendChild(document.createTextNode(
    'Card topics: ' + (topics.length ? topics.join(', ') : 'none (no card by design)')
    + (ex.insight_categories ? ' (set for this exercise)' : ' (default for ' + ex.body_area + ')')));
  meta.appendChild(document.createElement('br'));
  meta.appendChild(document.createTextNode(
    'Exercise tags: ' + [...(ex.concerns || []), ...(ex.tags || [])].join(', ')));
  if ((ex.suppress_insights || []).length) {
    meta.appendChild(document.createElement('br'));
    meta.appendChild(document.createTextNode(
      'Cards blocked for this exercise: ' + ex.suppress_insights.join(', ')));
  }
  meta.appendChild(document.createElement('br'));
  const link = el('a', null, 'Open this exercise');
  link.href = 'nudge.html?e=' + idx;
  meta.appendChild(link);
  box.appendChild(meta);
  out.appendChild(box);

  const scored = cardsFor(ex);
  if (!scored.length) {
    out.appendChild(el('div', 'none', 'No research card shows on this exercise.'));
    return;
  }
  const tiers = insightTiers(scored);
  const firstIds = new Set(tiers[0].map(i => i.id));
  const first = scored.filter(s => firstIds.has(s.ins.id));
  const rest = scored.filter(s => !firstIds.has(s.ins.id)).sort((a, b) => b.score - a.score);

  out.appendChild(el('h2', null, 'Shown first (' + first.length + ')'));
  out.appendChild(el('div', 'hint',
    'The first view of the day shows one of these, picked at random.'));
  first.forEach(s => out.appendChild(cardBox(s, true, ex)));

  if (rest.length) {
    out.appendChild(el('h2', null, 'Shown on later views (' + rest.length + ')'));
    out.appendChild(el('div', 'hint',
      'Once the cards above have been seen that day, these follow in random order.'));
    rest.forEach(s => out.appendChild(cardBox(s, false, ex)));
  }
}

async function load() {
  try {
    const opt = { cache: 'no-store' };
    [exercises, insights] = await Promise.all([
      fetch('../api/exercises.json', opt).then(r => r.json()),
      fetch('../api/insights.json', opt).then(r => r.json())
    ]);
  } catch (e) {
    out.appendChild(el('div', 'error', 'Could not load the exercise or card data: ' + e.message));
    document.getElementById('totals').textContent = '';
    return;
  }
  const none = exercises.filter(e => !cardsFor(e).length).length;
  document.getElementById('totals').textContent =
    exercises.length + ' exercises · ' + insights.length + ' cards · '
    + none + ' exercises with no card · live data, loaded just now';
  fillAreas();
  fillExercises();
}
areaSel.addEventListener('change', fillExercises);
exSel.addEventListener('change', showExercise);
load();
</script>
</body>
</html>
