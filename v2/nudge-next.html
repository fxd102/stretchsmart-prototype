<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StretchSmart Nudge</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e; color: #e0e0e0;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px 24px;
  }
  .container {
    max-width: 440px; width: 100%;
    display: flex; flex-direction: column; align-items: center;
  }
  .eyebrow {
    font-size: 11px; color: #888; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 8px;
  }
  h1 {
    font-size: 28px; font-weight: 700; color: #e94560;
    text-align: center; margin-bottom: 6px; line-height: 1.2;
  }
  .duration-hint {
    font-size: 13px; color: #4ecdc4; margin-bottom: 20px;
    letter-spacing: 0.5px;
  }
  .card {
    background: #16213e; border-radius: 20px; padding: 20px;
    width: 100%; margin-bottom: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .desc {
    font-size: 15px; line-height: 1.6; color: #ccc;
    text-align: center;
  }
  .start-btn {
    width: 100%; max-width: 360px;
    padding: 26px; border-radius: 32px;
    font-size: 22px; font-weight: 700;
    background: #e94560; color: white; border: none;
    cursor: pointer; transition: transform 0.1s;
    box-shadow: 0 6px 20px rgba(233,69,96,0.35);
    margin-bottom: 18px;
  }
  .start-btn:active { transform: scale(0.96); }
  .choosers {
    display: flex; gap: 8px; width: 100%;
  }
  .chooser {
    flex: 1; padding: 14px 6px;
    background: #2a2a4a; color: #aaa;
    border: 1px solid #3a3a5a; border-radius: 18px;
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
    text-align: center;
  }
  .chooser:hover {
    background: #1a3a5c; color: #6db3f2; border-color: #4ecdc4;
  }
  .timer-wrap {
    display: none; width: 100%; text-align: center;
  }
  .timer-wrap.show { display: block; }
  .phase-label {
    font-size: 16px; font-weight: 600; color: #e9a045;
    margin-bottom: 8px; min-height: 24px;
  }
  .phase-progress {
    font-size: 11px; color: #888; margin-bottom: 4px;
  }
  .timer-ring {
    width: 200px; height: 200px; position: relative;
    margin: 8px auto;
  }
  .timer-ring svg { transform: rotate(-90deg); }
  .timer-text {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px; font-weight: 700; color: #fff;
  }
  .total-remaining {
    font-size: 12px; color: #666; margin-top: 4px;
  }
  .mode-panel { display: none; text-align: center; margin: 6px 0 14px; }
  .mode-panel.show { display: block; }
  .mp-target { font-size: 30px; font-weight: 700; margin: 6px 0 2px; }
  .mp-target small { font-size: 17px; color: #aaa; font-weight: 600; }
  .mp-sub { font-size: 13px; color: #888; }
  .mp-tap { display: block; width: 100%; margin: 14px 0 4px; padding: 26px; font-size: 40px; font-weight: 700;
    color: #fff; background: #0f3460; border: none; border-radius: 16px; cursor: pointer; }
  .mp-done { display: block; width: 100%; margin-top: 12px; padding: 15px; font-size: 17px; font-weight: 600;
    color: #fff; background: #e94560; border: none; border-radius: 12px; cursor: pointer; }
  .mp-done.ghost { background: #2a2a4a; color: #ddd; }
  .mp-dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0 4px; }
  .mp-dot { width: 13px; height: 13px; border-radius: 50%; background: #2a2a4a; }
  .mp-dot.full { background: #4ecdc4; }
  .mp-rest button { background: none; border: 1px solid #2a2a4a; color: #4ecdc4; border-radius: 8px;
    padding: 2px 10px; font-size: 15px; cursor: pointer; }
  .sound-toggle {
    margin-top: 10px; background: none; border: 1px solid #2a2a4a; color: #aaa;
    border-radius: 16px; padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  .feedback {
    display: none; gap: 8px; width: 100%; margin-top: 16px;
  }
  .feedback.show { display: flex; }
  .fb-btn {
    flex: 1; padding: 14px;
    background: #2a2a4a; color: #e0e0e0;
    border: 1px solid #3a3a5a; border-radius: 18px;
    font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  .fb-btn.too-easy { border-color: #4ecdc4; }
  .fb-btn.doable { border-color: #e9a045; }
  .fb-btn.couldnt { border-color: #e94560; }
  .fb-btn:active { transform: scale(0.96); }
  .done-msg {
    display: none; text-align: center; padding: 20px 0;
    color: #4ecdc4; font-size: 17px;
  }
  .done-msg.show { display: block; }
  .back-link {
    font-size: 12px; color: #888; text-decoration: none;
    margin-top: 28px;
  }
  .hook {
    font-size: 15px; color: #ccc; font-style: italic;
    text-align: center; margin-bottom: 12px;
    line-height: 1.5; min-height: 22px;
  }
  .insight-card {
    display: none; background: #16213e; border-radius: 16px;
    padding: 18px; width: 100%; margin-bottom: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    border-left: 3px solid #4ecdc4;
  }
  .insight-card.show { display: block; }
  .insight-text {
    font-size: 14px; color: #ccc; line-height: 1.6;
    margin-bottom: 8px;
  }
  .insight-src {
    font-size: 11px; color: #888; font-style: italic;
  }
  .back-link:hover { color: #e94560; }
  /* two-screen flow */
  #nudge-screen { width: 100%; display: flex; flex-direction: column; align-items: center; }
  #nudge-screen.hide { display: none; }
  #detail-screen { display: none; width: 100%; flex-direction: column; align-items: center; }
  #detail-screen.show { display: flex; }
  .detail-name {
    font-size: 20px; font-weight: 700; color: #e94560;
    text-align: center; margin-bottom: 4px; line-height: 1.2;
  }
  /* clinical cues — compact tappable chips that reveal dense text on demand */
  .cues { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-bottom: 4px; }
  .cue {
    padding: 13px 10px; border-radius: 14px;
    background: #16213e; color: #cfd3dc; border: 1px solid #2a3050;
    font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
    transition: all 0.12s;
  }
  .cue:active { transform: scale(0.97); }
  .cue.active { border-color: #4ecdc4; color: #4ecdc4; }
  .cue.stop { border-color: #6e2233; color: #f08aa0; }
  .cue.stop.active { border-color: #e94560; color: #e94560; }
  .cue-panel { width: 100%; }
  .cue-body {
    background: #16213e; border-radius: 14px; padding: 14px 16px; margin-top: 8px;
    border-left: 3px solid #4ecdc4; text-align: left;
    font-size: 14px; line-height: 1.55; color: #ddd;
  }
  .cue-body.stop { border-left-color: #e94560; background: #251820; }
  .cue-title {
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    color: #4ecdc4; font-weight: 700; margin-bottom: 5px;
  }
  .cue-body.stop .cue-title { color: #e94560; }
  .draft-flag {
    font-size: 11px; color: #888; font-style: italic;
    text-align: center; margin-bottom: 20px; min-height: 14px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">StretchSmart</div>

    <!-- SCREEN 1: the nudge — exercise name + motivation -->
    <div id="nudge-screen">
      <p class="hook" id="hook"></p>
      <h1 id="ex-name">Loading…</h1>
      <div class="insight-card" id="insight-card" style="margin-bottom:18px;">
        <p class="insight-text" id="insight-text"></p>
        <p class="insight-src" id="insight-src"></p>
      </div>
      <button class="start-btn" id="start-btn" onclick="showDetail()">Let's Go</button>
      <div class="choosers" id="choosers"></div>
    </div>

    <!-- SCREEN 2: the detail — animation + timer above the fold; instructions
         and clinical cues below (dense text tucked behind tappable cue chips) -->
    <div id="detail-screen">
      <div class="detail-name" id="detail-name"></div>
      <div class="duration-hint" id="ex-duration"></div>
      <div id="chosen-for" style="display:none;font-size:12px;color:#4ecdc4;margin-top:-6px;margin-bottom:10px;"></div>

      <div class="timer-wrap" id="timer-wrap">
        <div class="phase-label" id="phase-label"></div>
        <div class="phase-progress" id="phase-progress"></div>
        <div class="timer-ring">
          <svg width="200" height="200">
            <circle cx="100" cy="100" r="90" fill="none" stroke="#2a2a4a" stroke-width="8"/>
            <circle id="ring" cx="100" cy="100" r="90" fill="none" stroke="#e94560" stroke-width="8"
              stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="0"/>
          </svg>
          <div class="timer-text" id="timer-text">—</div>
        </div>
        <div class="total-remaining" id="total-remaining"></div>
        <button class="sound-toggle" id="sound-toggle" onclick="toggleSound()"></button>
      </div>

      <!-- TEST COPY (2026-10-28): rep and hold-and-repeat screens, chosen from the exercise's dose. -->
      <div class="mode-panel" id="reps-panel">
        <div class="mp-target" id="reps-target"></div>
        <div class="mp-sub">Go at your own pace.</div>
        <button class="mp-tap" id="reps-tap">0</button>
        <div class="mp-sub">Tap to keep count</div>
        <button class="mp-done" id="reps-done">Done</button>
      </div>
      <div class="mode-panel" id="hold-panel">
        <div class="mp-target" id="hold-target"></div>
        <div class="mp-dots" id="hold-dots"></div>
        <div class="mp-sub mp-rest" id="hold-rest">Rest between holds:
          <button id="rest-minus">−</button> <b id="rest-val">3</b>s <button id="rest-plus">+</button></div>
        <button class="mp-done" id="hold-start">Start</button>
        <div class="mp-sub" id="hold-pausehint" style="display:none;margin-top:8px">Tap anywhere to pause</div>
        <button class="mp-done ghost" id="hold-done">Done</button>
      </div>

      <div class="card">
        <p class="desc" id="ex-desc">&nbsp;</p>
      </div>

      <div class="cues" id="ex-cues"></div>
      <div class="cue-panel" id="cue-panel"></div>
      <div class="draft-flag" id="draft-flag"></div>

      <div class="feedback" id="feedback">
        <button class="fb-btn too-easy" onclick="submitFeedback('too-easy')">Too Easy</button>
        <button class="fb-btn doable" onclick="submitFeedback('doable')">Doable</button>
        <button class="fb-btn couldnt" onclick="submitFeedback('couldnt')">Couldn't</button>
      </div>

      <div class="done-msg" id="done-msg">
        ✓ Logged. Same exercise on your next nudge today.
      </div>
    </div>

    <a class="back-link" href="../index.html">← Back to StretchSmart</a>
  </div>

<script src="prefs.js"></script>
<script src="insight-match.js"></script>
<script>
const CIRC = 565.5; // 2 * pi * 90
let exercises = [];
let exercise = null;
let currentIdx = 0;
let timerId = null;
let audioCtx = null;

const POSITION_LABELS = {seated: 'Seated', standing: 'Standing', floor: 'Floor'};

const HOOKS = {
  morning: [
    "Your body's been waiting for this. Ready?",
    "Good morning to your muscles.",
    "You know what feels better than sitting? This.",
    "Start the day by showing up for yourself.",
  ],
  midday: [
    "Quick check-in with your body. Just a minute.",
    "Halfway through your day. Time to move.",
    "Your future self thanks you for this one.",
    "You've been great today. Keep the streak.",
  ],
  afternoon: [
    "One more today. This is the one that compounds.",
    "Almost done for the day. Let's close it out.",
    "You've already shown up. One more round.",
    "Last stretch of the day. Make it count.",
  ],
};

let insights = [];

function totalDuration(ex) {
  return (ex.phases || []).reduce((s, p) => s + (p.seconds || 0), 0);
}

async function loadExercise() {
  exercises = await fetch('../api/exercises.json').then(r => r.json());
  const params = new URLSearchParams(location.search);
  let idx = parseInt(params.get('e'));
  let chosenFor = null;
  if (isNaN(idx) || idx < 0 || idx >= exercises.length) {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayNo = Math.floor((now - start) / 86400000);

    // Honour saved onboarding concerns when no explicit ?e was given. An
    // explicit ?e always wins: the daily nudge link must show the exercise it
    // advertised. Rotates by day WITHIN the matching set, so it is stable for
    // a day and still varies -- and falls back to the whole catalogue if the
    // concerns match nothing, rather than showing an empty screen.
    const prefs = window.StretchPrefs ? StretchPrefs.load() : null;
    const wanted = prefs ? StretchPrefs.tagsForConcerns(prefs.concerns) : [];
    let pool = exercises;
    if (wanted.length) {
      const matching = exercises.filter(function (ex) {
        return (ex.concerns || []).some(function (c) {
          return wanted.indexOf(String(c).toLowerCase()) !== -1;
        });
      });
      if (matching.length) { pool = matching; chosenFor = wanted; }
    }
    const picked = pool[dayNo % pool.length];
    idx = exercises.indexOf(picked);
  }
  currentIdx = idx;
  exercise = exercises[idx];

  document.getElementById('ex-name').textContent = exercise.name;
  document.getElementById('detail-name').textContent = exercise.name;
  document.getElementById('ex-duration').textContent = modeSummary(exercise);
  document.getElementById('ex-desc').textContent = exercise.desc;
  if (chosenFor) {
    var cf = document.getElementById('chosen-for');
    cf.textContent = 'Chosen for your saved concerns: ' + chosenFor.join(', ');
    cf.style.display = 'block';
  }
  renderCues();

  // Illustrations removed 2026-09-12 on Faith's instruction: the line art was
  // placeholder quality and only ~2% of the catalogue was ever covered, with an
  // onerror handler silently hiding the other 98% so the gap read as a design
  // choice. Text-only is now DELIBERATE rather than accidental. Real
  // illustrations may be commissioned later, after the rest is settled.

  // Hook text based on time of day
  const hr = new Date().getHours();
  const period = hr < 11 ? 'morning' : hr < 14 ? 'midday' : 'afternoon';
  const hookList = HOOKS[period];
  document.getElementById('hook').textContent = hookList[Math.floor(Math.random() * hookList.length)];

  // Load insights and show the one most relevant to THIS exercise as motivation before starting
  try {
    insights = await fetch('../api/insights.json').then(r => r.json());
  } catch (e) { insights = []; }
  showRelevantInsight();

  buildChoosers();
}

function buildChoosers() {
  const container = document.getElementById('choosers');
  container.innerHTML = '';
  const pos = exercise.position;
  Object.keys(POSITION_LABELS).forEach(key => {
    if (key === pos) return;
    const alts = exercises.filter((e, i) => e.position === key && i !== currentIdx);
    if (!alts.length) return;
    const btn = document.createElement('button');
    btn.className = 'chooser';
    btn.textContent = 'Switch to ' + POSITION_LABELS[key];
    btn.onclick = () => switchTo(key);
    container.appendChild(btn);
  });
}

/* What the DAILY SENDER will pick today, computed the same way scan_and_nudge.py
   does it: date.toordinal() % len(exercises). Verified against state/nudges.json —
   this formula reproduces all 15 recorded fires exactly.
   Needed because the confirmation message used to promise "same exercise on your
   next nudge today" unconditionally, which is false whenever you have switched
   position: switchTo() only rewrites this page's URL, and the sender never sees it.
   (Edge case: a viewer in a very different timezone could straddle the sender's
   date near midnight. Not worth special-casing for a single-user prototype.) */
function senderPickToday() {
  const d = new Date();
  const days = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  return (days + 719163) % exercises.length;   // 719163 = ordinal of 1970-01-01
}

function switchTo(pos) {
  const alts = exercises
    .map((e, i) => ({e, i}))
    .filter(x => x.e.position === pos && x.i !== currentIdx);
  if (!alts.length) return;
  const pick = alts[Math.floor(Math.random() * alts.length)];
  const url = new URL(location);
  url.searchParams.set('e', pick.i);
  location.href = url;
}

// Audio cues (Blake, 2026-10-17): a voice names each step as it starts, short beeps count
// down the last 3 seconds of each step, and the voice says "Done" at the end.
// Faith, 2026-10-18: the DEFAULT comes from the master setting (preferences: audio_cues,
// set in onboarding; unset = off). The toggle under the timer changes sound for this
// exercise only, in real time, and never changes the default.
let soundOn = false;
try { soundOn = !!(window.StretchPrefs && StretchPrefs.load().audio_cues === true); } catch (e) {}

function renderSoundToggle() {
  const b = document.getElementById('sound-toggle');
  if (b) b.textContent = soundOn ? '🔊 Sound on' : '🔇 Sound off';
}

function toggleSound() {
  soundOn = !soundOn;
  if (!soundOn) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  renderSoundToggle();
}

function say(text) {
  if (!soundOn || !text) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function beep(freq = 660, len = 0.12) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + len);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + len);
  } catch (e) {}
}

// What the voice says when a step starts: the step's own label for multi-step exercises
// (dashes read as pauses), or the total time for a single block.
function spokenCue(phases, idx) {
  if (phases.length > 1) return phases[idx].label.replace(/\s*—\s*/g, ', ');
  return 'Go. ' + phases[idx].seconds + ' seconds.';
}

function playDing() {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  } catch (e) {}
  try { navigator.vibrate(200); } catch (e) {}
}

function remainingFromPhase(phaseIdx, elapsedInPhase) {
  const phases = exercise.phases;
  let rem = Math.max(0, phases[phaseIdx].seconds - elapsedInPhase);
  for (let i = phaseIdx + 1; i < phases.length; i++) rem += phases[i].seconds;
  return Math.ceil(rem);
}

// Clinical cue chips: short user-facing labels that expand the dense
// PT-schema text on demand, so the animation + timer stay above the fold.
const CUE_FIELDS = [
  {key: 'form_cue',       chip: 'Form check',       title: 'Form cue',        cls: ''},
  {key: 'stop_condition', chip: 'Pain or strain?',  title: 'When to stop',    cls: 'stop'},
  {key: 'regression',     chip: 'Too hard?',        title: 'Make it easier',  cls: ''},
  {key: 'remediation',    chip: "Can't hold form?", title: 'Build up first',  cls: ''},
];
let openCueKey = null;

function renderCues() {
  const grid = document.getElementById('ex-cues');
  const panel = document.getElementById('cue-panel');
  grid.innerHTML = '';
  panel.innerHTML = '';
  openCueKey = null;
  CUE_FIELDS.filter(f => exercise[f.key]).forEach(f => {
    const chip = document.createElement('button');
    chip.className = 'cue' + (f.cls ? ' ' + f.cls : '');
    chip.textContent = f.chip;
    chip.onclick = () => toggleCue(f, chip);
    grid.appendChild(chip);
  });
  document.getElementById('draft-flag').textContent =
    exercise.validation === 'draft_pending_pt'
      ? 'Clinical guidance — draft, pending PT review' : '';
}

function toggleCue(f, chip) {
  const panel = document.getElementById('cue-panel');
  document.querySelectorAll('.cue').forEach(c => c.classList.remove('active'));
  if (openCueKey === f.key) { panel.innerHTML = ''; openCueKey = null; return; }
  openCueKey = f.key;
  chip.classList.add('active');
  const body = document.createElement('div');
  body.className = 'cue-body' + (f.cls ? ' ' + f.cls : '');
  const title = document.createElement('div');
  title.className = 'cue-title';
  title.textContent = f.title;
  const text = document.createElement('div');
  text.textContent = exercise[f.key];
  body.appendChild(title);
  body.appendChild(text);
  panel.innerHTML = '';
  panel.appendChild(body);
}

// "Let's Go" → reveal the detail screen (instructions + parameters) and run the timer.
// ---- Exercise modes (TEST COPY, 2026-10-28; Faith + Aster) -----------------------------
// The screen is chosen from the exercise's dose, not from its timer:
//   timed  - the time IS the instruction: the countdown, unchanged.
//   reps   - "do it N times": target, optional tap counter, Done. No clock.
//   hold   - "hold N s, R times": one Start, then hold / rest run hands-free; the rest is the
//            user's choice (not prescribed); tap anywhere to pause.
function exerciseMode(ex) {
  const d = ex.dose || {};
  if (d.steps) return {mode: 'timed'};
  const holdS = d.rep_hold || (d.hold && d.rounds ? d.hold : null);
  const count = d.reps || (d.hold && d.rounds ? d.rounds : null);
  if (holdS && count) return {mode: 'hold', hold: holdS, count: count, sides: d.sides || 'none',
                               labels: d.labels || ['Right', 'Left']};
  if (d.reps) return {mode: 'reps', count: d.reps, sides: d.sides || 'none'};
  return {mode: 'timed'};
}
function sidesWord(sides) {
  return sides === 'each' ? ' each side' : sides === 'alternate' ? ' each side, alternating' : '';
}
function modeSummary(ex) {
  const m = exerciseMode(ex);
  if (m.mode === 'reps') return m.count + (m.sides === 'none' ? ' reps' : sidesWord(m.sides));
  if (m.mode === 'hold') return 'Hold ' + m.hold + 's × ' + m.count + sidesWord(m.sides);
  return totalDuration(ex) + ' seconds';
}
function finishExercise() {
  document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('show'));
  document.getElementById('timer-wrap').classList.remove('show');
  document.getElementById('feedback').classList.add('show');
  playDing();
  say('Done');
}
function startReps(m) {
  const panel = document.getElementById('reps-panel'), tap = document.getElementById('reps-tap');
  document.getElementById('reps-target').innerHTML =
    m.count + (m.sides === 'none' ? ' <small>reps</small>' : ' <small>' + sidesWord(m.sides).trim() + '</small>');
  let n = 0; tap.textContent = '0';
  tap.onclick = () => { n++; tap.textContent = n; };
  document.getElementById('reps-done').onclick = finishExercise;
  panel.classList.add('show');
}
function holdPlan(m) {
  const H = m.hold, R = m.count, out = [];
  if (m.sides === 'alternate') {
    for (let k = 1; k <= R; k++) { out.push(m.labels[0] + ' — hold ' + k + ' of ' + R); out.push(m.labels[1] + ' — hold ' + k + ' of ' + R); }
  } else if (m.sides === 'each') {
    for (let k = 1; k <= R; k++) out.push('First side — hold ' + k + ' of ' + R);
    out.push('SWITCH');
    for (let k = 1; k <= R; k++) out.push('Other side — hold ' + k + ' of ' + R);
  } else {
    for (let k = 1; k <= R; k++) out.push('Hold ' + k + ' of ' + R);
  }
  return out;
}
function startHold(m) {
  const panel = document.getElementById('hold-panel');
  const plan = holdPlan(m), holds = plan.filter(p => p !== 'SWITCH');
  let rest = 3;
  try { rest = Math.max(1, Math.min(30, parseInt(localStorage.getItem('ss_rest') || '3', 10) || 3)); } catch (e) {}
  const restVal = document.getElementById('rest-val'); restVal.textContent = rest;
  const setRest = (v) => { rest = Math.max(1, Math.min(30, v)); restVal.textContent = rest;
    try { localStorage.setItem('ss_rest', String(rest)); } catch (e) {} };
  document.getElementById('rest-minus').onclick = (e) => { e.stopPropagation(); setRest(rest - 1); };
  document.getElementById('rest-plus').onclick = (e) => { e.stopPropagation(); setRest(rest + 1); };
  document.getElementById('hold-target').innerHTML =
    'Hold ' + m.hold + 's <small>× ' + m.count + sidesWord(m.sides) + '</small>';
  const dots = document.getElementById('hold-dots');
  dots.innerHTML = holds.map(() => '<span class="mp-dot"></span>').join('');
  const dotEls = dots.querySelectorAll('.mp-dot');
  const startBtn = document.getElementById('hold-start'), hint = document.getElementById('hold-pausehint');
  startBtn.style.display = ''; hint.style.display = 'none';
  panel.classList.add('show');

  let i = 0, done = 0, phase = 'hold', left = 0, total = 0, last = 0, paused = false, running = false, id = null;
  const ring = document.getElementById('ring'), txt = document.getElementById('timer-text');
  const label = document.getElementById('phase-label'), prog = document.getElementById('phase-progress');
  function enter(ph, secs, text, speak) {
    phase = ph; left = total = secs; label.textContent = text; label.style.display = '';
    ring.style.stroke = ph === 'hold' ? '#e94560' : '#4ecdc4';
    if (speak) say(speak);
  }
  function next() {
    if (i >= plan.length) { stop(); finishExercise(); return; }
    const p = plan[i++];
    if (p === 'SWITCH') { enter('rest', Math.max(rest, 2), 'Switch sides', 'Switch sides'); return; }
    enter('hold', m.hold, p, done === 0 ? p.replace(/\s*—\s*/g, ', ') : 'Hold');
  }
  let lastBeep = null;
  function tick() {
    const now = Date.now(); if (!paused) left -= (now - last) / 1000; last = now;
    const show = Math.max(0, Math.ceil(left));
    txt.textContent = paused ? '❚❚' : show;
    ring.style.strokeDashoffset = (CIRC * Math.min(1, 1 - left / total)).toFixed(1);
    prog.textContent = paused ? 'Paused — tap anywhere to carry on' : (phase === 'hold' ? 'Hold' : 'Rest');
    if (!paused && phase === 'hold' && total >= 6 && show >= 1 && show <= 3 && show !== lastBeep) { lastBeep = show; beep(); }
    if (paused || left > 0) return;
    if (phase === 'hold') {
      dotEls[done].classList.add('full'); done++;
      if (i < plan.length && plan[i] !== 'SWITCH') { playDing(); enter('rest', rest, 'Rest', 'Rest'); }
      else next();
    } else next();
  }
  function stop() { running = false; if (id) clearInterval(id); id = null;
    document.getElementById('detail-screen').onclick = null; }
  startBtn.onclick = (e) => {
    e.stopPropagation(); startBtn.style.display = 'none'; hint.style.display = '';
    document.getElementById('hold-rest').style.display = 'none';
    document.getElementById('timer-wrap').classList.add('show');
    document.getElementById('total-remaining').textContent = '';
    running = true; last = Date.now(); next(); id = setInterval(tick, 100); timerId = id;
    document.getElementById('detail-screen').onclick = (ev) => {
      if (!running || ev.target.closest('button') || ev.target.closest('.cues') || ev.target.closest('.cue-panel')) return;
      paused = !paused;
    };
  };
  document.getElementById('hold-done').onclick = (e) => { e.stopPropagation(); stop(); finishExercise(); };
}

function showDetail() {
  const m = exerciseMode(exercise);
  if (m.mode === 'timed') return showDetailTimed();
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  document.getElementById('nudge-screen').classList.add('hide');
  document.getElementById('detail-screen').classList.add('show');
  renderSoundToggle();
  if (m.mode === 'reps') startReps(m); else startHold(m);
}

function showDetailTimed() {
  // Unlock audio context on user gesture (mobile Safari)
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  document.getElementById('nudge-screen').classList.add('hide');
  document.getElementById('detail-screen').classList.add('show');
  document.getElementById('timer-wrap').classList.add('show');
  renderSoundToggle();
  runPhase(0);
}

// carryIn: seconds already spent on the pause between steps. They count against this step,
// so the countdown's total equals the sum of the steps (Aster, 2026-10-14: the 0.6 s pause
// was uncounted, and a 16-step exercise showed 80 s but took 89).
function runPhase(phaseIdx, carryIn = 0) {
  const phases = exercise.phases;
  if (phaseIdx >= phases.length) {
    document.getElementById('timer-wrap').classList.remove('show');
    document.getElementById('feedback').classList.add('show');
    playDing();
    say('Done');
    return;
  }

  const phase = phases[phaseIdx];
  // Single-step exercises stored a truncated copy of the desc in phase.label,
  // duplicating the description card below the timer — hide it. Multi-step keeps
  // the label, where it names the current step.
  const phaseLabelEl = document.getElementById('phase-label');
  if (phases.length > 1) {
    phaseLabelEl.textContent = phase.label;
    phaseLabelEl.style.display = '';
  } else {
    phaseLabelEl.style.display = 'none';
  }
  document.getElementById('phase-progress').textContent =
    phases.length > 1 ? 'Step ' + (phaseIdx + 1) + ' of ' + phases.length : '';
  document.getElementById('timer-text').textContent = phase.seconds;
  document.getElementById('ring').style.transition = 'none';
  document.getElementById('ring').style.strokeDashoffset = '0';
  // Force reflow so transition reset takes effect
  void document.getElementById('ring').offsetWidth;
  document.getElementById('ring').style.transition = 'stroke-dashoffset 0.25s linear';

  const startTime = Date.now() - carryIn * 1000;
  say(spokenCue(phases, phaseIdx));
  let lastBeep = null;

  function tick() {
    const elapsed = (Date.now() - startTime) / 1000;
    const left = Math.max(0, Math.ceil(phase.seconds - elapsed));
    // Count down the last 3 seconds of any step long enough to need it.
    if (phase.seconds >= 6 && left >= 1 && left <= 3 && left !== lastBeep) {
      lastBeep = left;
      beep();
    }
    document.getElementById('timer-text').textContent = left;
    const frac = Math.min(1, elapsed / phase.seconds);
    document.getElementById('ring').style.strokeDashoffset = (CIRC * frac).toFixed(1);
    document.getElementById('total-remaining').textContent =
      remainingFromPhase(phaseIdx, elapsed) + 's total remaining';

    if (left <= 0) {
      clearInterval(timerId);
      if (phaseIdx < phases.length - 1) {
        playDing();
        setTimeout(() => runPhase(phaseIdx + 1, 0.6), 600);
      } else {
        runPhase(phaseIdx + 1);
      }
    }
  }
  tick();
  timerId = setInterval(tick, 200);
}

function showRelevantInsight() {
  // Which cards fit this exercise is decided in insight-match.js, shared with cards.html.
  const scored = relevantInsights(exercise, insights);
  if (!scored.length) return;   // no card beats an unrelated card

  // Clean up old daily keys and load today's shown-list
  const today = new Date().toISOString().slice(0, 10);
  const storageKey = 'ss_shown_insights_' + today;
  for (let k = 0; k < localStorage.length; k++) {
    const key = localStorage.key(k);
    if (key && key.startsWith('ss_shown_insights_') && key !== storageKey) {
      localStorage.removeItem(key);
    }
  }
  const shownMap = JSON.parse(localStorage.getItem(storageKey) || '{}');
  let shownForEx = shownMap[exercise.name] || [];

  const tiers = insightTiers(scored);

  // Walk tiers preferring unseen insights for this exercise today
  let pick = null;
  for (const tier of tiers) {
    const unseen = tier.filter(i => !shownForEx.includes(i.id));
    if (unseen.length) { pick = unseen[Math.floor(Math.random() * unseen.length)]; break; }
  }
  if (!pick) {
    shownForEx = [];
    pick = tiers[0][Math.floor(Math.random() * tiers[0].length)];
  }

  shownForEx = shownForEx.concat([pick.id]);
  shownMap[exercise.name] = shownForEx;
  localStorage.setItem(storageKey, JSON.stringify(shownMap));

  document.getElementById('insight-text').textContent = pick.text;
  document.getElementById('insight-src').textContent = pick.source ? '— ' + pick.source : '';
  document.getElementById('insight-card').classList.add('show');
}

function submitFeedback(val) {
  const log = JSON.parse(localStorage.getItem('ss_feedback') || '[]');
  log.push({ t: new Date().toISOString(), exercise: exercise.name, rating: val });
  localStorage.setItem('ss_feedback', JSON.stringify(log));
  document.getElementById('feedback').classList.remove('show');
  // Only promise continuity when it is actually true.
  var msg = document.getElementById('done-msg');
  try {
    var sender = senderPickToday();
    msg.textContent = (sender === currentIdx)
      ? '\u2713 Logged. Same exercise on your next nudge today.'
      : '\u2713 Logged. Heads up \u2014 your next nudge today is still '
        + exercises[sender].name + ', not this one.';
  } catch (e) { /* leave the default text rather than break the flow */ }
  msg.classList.add('show');
}

loadExercise();
